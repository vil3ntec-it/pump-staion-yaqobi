name: ساخت برنامهٔ اندروید (APK)

# فایل نصبِ اندروید (.apk) را می‌سازد و در Releases می‌گذارد.
#
# ── چرا دیگر خودکار نیست ─────────────────────────────────────────────────────
# ⛔ این فایلِ نصب، برنامهٔ **قدیمیِ سایت** (index.html) را می‌بندد و صاحب ریپو
# در ۱۴۰۵/۰۶/۲۴ صریح گفت: «چرا سایتِ قدیم را دادی؟ آن برنامه یا سایت را ول کن.
# من اگر آن را می‌خواستم خودم می‌گفتم… دیگر با سایتِ قدیم و برنامهٔ قدیم هیچ
# ارتباطی نداری مگر گفته باشم در پرامپت.»
#
# پس ساختِ خودکار برداشته شد: هر بار که این اجرا می‌شد، یک انتشارِ تازهٔ
# ‎android-latest‎ می‌ساخت و همان بود که به‌اشتباه به‌جای اپِ تازه نصب شد.
#
# فایلِ نصبی که باید داده شود ‎build-kar-apk.yml‎ است — اپی که زنده به برنامهٔ
# نیتیو وصل است.
#
# ⚠️ خودِ ورک‌فلو پاک نشده و ‎workflow_dispatch‎ دارد: اگر روزی صاحب ریپو خودش
# آن فایلِ نصب را خواست، با یک دکمه ساخته می‌شود.

on:
  workflow_dispatch:

# actions: write برای صدا زدنِ دیپلویِ سایت بعد از ساخته شدنِ APK
permissions:
  contents: write
  actions: write

# اگر چند تغییر پشتِ سرِ هم مرج شد، فقط آخری ساخته شود
concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب جاوا ۱۷
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی Android SDK
        uses: android-actions/setup-android@v3

      - name: گذاشتنِ خودِ برنامه داخلِ فایل نصب
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html sw.js manifest.json favicon.png android/app/src/main/assets/www/
          cp -r icons android/app/src/main/assets/www/ || true
          echo "محتوای بسته‌شده:"; ls -la android/app/src/main/assets/www/

      - name: ساختِ آیکون‌های برنامه
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; px=${d##*:}
            mkdir -p android/app/src/main/res/mipmap-$n
            convert icons/icon-512.png -resize ${px}x${px} android/app/src/main/res/mipmap-$n/ic_launcher.png
          done

      # نسخهٔ اپ همیشه همان نسخهٔ خودِ برنامه است — دستی تنظیم نمی‌شود
      - name: خواندنِ نسخهٔ برنامه از index.html
        id: ver
        run: |
          V=$(python3 - <<'PY'
          import re
          h = open('index.html', encoding='utf-8', errors='ignore').read()
          m = re.search(r"const\s+APP_VERSION\s*=\s*['\"]([0-9.]+)['\"]", h)
          print(m.group(1) if m else '0.0.1')
          PY
          )
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "نسخهٔ برنامه: $V"

      - name: ساختِ APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleRelease --no-daemon -PappVersionName=${{ steps.ver.outputs.version }}

      - name: نام‌گذاری فایل
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/PumpYaqobi-$(date +%Y%m%d).apk"
          # یک نام ثابت هم می‌سازیم تا لینکِ دانلود در سایت هیچ‌وقت نشکند
          cp android/app/build/outputs/apk/release/*.apk "out/PumpYaqobi.apk"
          # نسخهٔ خودِ فایلِ نصب کنارش منتشر می‌شود تا صفحهٔ دریافت بتواند
          # بنویسد «نسخهٔ فایل نصب: …» و هر عقب‌ماندگی فوری دیده شود
          echo -n "${{ steps.ver.outputs.version }}" > "out/PumpYaqobi-version.txt"
          ls -la out/

      - name: بارگذاری به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PumpYaqobi-Android-APK
          path: out/*.apk
          if-no-files-found: error

      - name: انتشار در Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: برنامهٔ اندروید پمپ یعقوبی (آخرین نسخه)
          body: |
            فایل نصبِ اندروید. روی گوشی دانلود و باز کنید.

            بار اول اندروید می‌گوید «نصب از منبع ناشناس» — اجازه بدهید.
            خودِ برنامه داخلِ همین فایل است، پس بدون اینترنت هم کار می‌کند و
            هیچ نوارِ آدرس یا سربرگِ مرورگر بالای صفحه نمی‌آید.
          files: |
            out/*.apk
            out/PumpYaqobi-version.txt
          make_latest: false

      # سایت فایلِ نصب را از همین انتشار برمی‌دارد. دیپلویِ سایت هم‌زمان با این
      # ساخت شروع شده بود، پس نسخهٔ کهنه را برداشته؛ حالا که فایلِ تازه منتشر
      # شد، یک‌بار دیگر صدایش می‌زنیم تا فایلِ تازه کنارِ سایت بنشیند.
      - name: تازه‌سازیِ سایت با فایلِ نصبِ تازه
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --ref main \
            && echo "دیپلوی سایت صدا زده شد" \
            || echo "::warning::دیپلوی سایت صدا زده نشد — سایت با دیپلوی بعدی تازه می‌شود"
