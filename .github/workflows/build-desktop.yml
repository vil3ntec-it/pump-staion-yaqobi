name: ساخت برنامهٔ کامپیوتری (ویندوز)

# نصب‌کنندهٔ ویندوز (.exe) را می‌سازد و به‌صورت یک Release قابل‌دانلود منتشر می‌کند.
#
# ── چرا خودکار شد ────────────────────────────────────────────────────────────
# خودِ برنامه (index.html) داخلِ همین فایلِ نصب بسته می‌شود، پس نصب‌کننده فقط
# وقتی تازه می‌شود که این ورک‌فلو اجرا شود. قبلاً فقط دستی/با تگ اجرا می‌شد و
# نتیجه‌اش این بود که فایلِ نصبِ روی سایت یک ماه و ده‌ها نسخه عقب ماند: کسی که
# آن را نصب کرده بود نه یادداشت‌ها را داشت، نه اصلاً به‌روزرسانیِ داخلِ برنامه را.
# حالا دقیقاً مثل اپِ اندروید، با هر تغییرِ خودِ برنامه روی main دوباره ساخته و
# منتشر می‌شود و بعد دیپلویِ سایت را صدا می‌زند تا همان فایلِ تازه کنارِ سایت
# بنشیند.
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'
    branches:
      - main
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'favicon.png'
      - 'icons/**'
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'

# actions: write برای صدا زدنِ دیپلویِ سایت بعد از ساخته شدنِ نصب‌کننده
permissions:
  contents: write
  actions: write

# اگر چند تغییر پشتِ سرِ هم مرج شد، فقط آخری ساخته شود
concurrency:
  group: desktop-exe
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # نسخهٔ نصب‌کننده همیشه همان نسخهٔ خودِ برنامه است — دستی تنظیم نمی‌شود.
      # (نامِ فایلِ خروجی و «About»ِ ویندوز از همین package.json خوانده می‌شوند.)
      - name: هم‌نسخه کردنِ نصب‌کننده با خودِ برنامه
        id: ver
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const m = html.match(/const\s+APP_VERSION\s*=\s*['\"]([0-9.]+)['\"]/);
            const v = m ? m[1] : '0.0.1';
            const p = 'desktop/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = v;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + v + '\n');
            console.log('نسخهٔ برنامه: ' + v);
          "

      - name: نصب وابستگی‌ها
        working-directory: desktop
        run: npm install

      # electron-builder موتورِ الکترون و ابزارهای NSIS را از Releasesِ گیت‌هاب
      # می‌گیرد (بیش از ۱۲۰ مگابایت). حالا که این ورک‌فلو با هر تغییر اجرا
      # می‌شود، همان دانلودها هم هر بار تکرار می‌شدند — هم کُند، و هم دقیقاً
      # همان‌جایی که ساختِ اول شکست («connection forcibly closed»). با کش،
      # اجراهای بعدی اصلاً سراغِ شبکه نمی‌روند.
      - name: کشِ موتورِ الکترون و ابزارهای ساخت
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-eb-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: ${{ runner.os }}-eb-

      - name: ساخت نصب‌کنندهٔ ویندوز
        working-directory: desktop
        shell: bash
        # انتشار توسط خودِ electron-builder خاموش است (publish never)؛ انتشار Release
        # را در مرحلهٔ جداگانهٔ پایین با action-gh-release انجام می‌دهیم.
        #
        # سه تلاش: دانلودِ ابزارهای ساخت از گیت‌هاب گاهی وسطِ کار قطع می‌شود و
        # electron-builder برای همهٔ آن‌ها خودش دوباره تلاش نمی‌کند. تلاشِ دوم
        # چیزی را که در تلاشِ اول رسیده از کش برمی‌دارد، پس تکرار ارزان است.
        run: |
          npm run prepare-app
          for i in 1 2 3; do
            if npx electron-builder --win nsis --publish never; then exit 0; fi
            echo "::warning::ساختِ نصب‌کننده در تلاشِ $i نشد — دوباره تلاش می‌کنیم"
            sleep 15
          done
          echo "::error::ساختِ نصب‌کننده بعد از سه تلاش هم نشد"
          exit 1

      - name: نام‌گذاری فایل
        shell: bash
        run: |
          mkdir -p out
          # نامِ خودِ electron-builder نسخه‌دار است (PumpYaqobi-Setup-2.9.x.exe) و
          # همان به‌عنوان Artifactِ همین اجرا نگه داشته می‌شود. ولی در Releases
          # فقط نامِ ثابت منتشر می‌شود: حالا که با هر تغییر ساخته می‌شود، فایلِ
          # نسخه‌دار هر بار ۸۰ مگابایتِ تازه به انتشار اضافه می‌کرد و تا صدها
          # گیگابایت بالا می‌رفت. نامِ ثابت هر بار جای قبلی را می‌گیرد، و لینکِ
          # دانلودِ سایت هم هیچ‌وقت نمی‌شکند.
          cp desktop/dist/*.exe "out/PumpYaqobi-Setup-${{ steps.ver.outputs.version }}.exe"
          mkdir -p rel
          cp desktop/dist/*.exe "rel/PumpYaqobi-Setup.exe"
          # نسخهٔ خودِ فایلِ نصب کنارش منتشر می‌شود تا صفحهٔ دریافت بتواند
          # بنویسد «نسخهٔ فایل نصب: …» و هر عقب‌ماندگی فوری دیده شود
          printf '%s' "${{ steps.ver.outputs.version }}" > "rel/PumpYaqobi-version.txt"
          ls -la out/ rel/

      - name: بارگذاری فایل نصب به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PumpYaqobi-Windows-Setup
          path: out/*.exe
          if-no-files-found: error

      - name: انتشار در Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: برنامهٔ کامپیوتری پمپ یعقوبی (آخرین نسخه)
          body: |
            نصب‌کنندهٔ ویندوز برنامهٔ پمپ یعقوبی — نسخهٔ ${{ steps.ver.outputs.version }}.

            فایل `PumpYaqobi-Setup.exe` را دانلود و اجرا کنید؛ هنگام نصب می‌توانید
            درایو و مسیر نصب را انتخاب کنید.

            خودِ برنامه داخلِ همین فایل است، پس بدون اینترنت هم کامل کار می‌کند و
            هیچ نوارِ آدرس یا سربرگِ مرورگری در کار نیست. نسخه‌های بعدی را هم خودش
            در پس‌زمینه می‌گیرد — دیگر برای هر تغییر نباید دوباره نصبش کنید.
          files: |
            rel/PumpYaqobi-Setup.exe
            rel/PumpYaqobi-version.txt
          make_latest: false

      # سایت فایلِ نصب را از همین انتشار برمی‌دارد. دیپلویِ سایت هم‌زمان با این
      # ساخت شروع شده بود، پس نسخهٔ کهنه را برداشته؛ حالا که فایلِ تازه منتشر
      # شد، یک‌بار دیگر صدایش می‌زنیم تا فایلِ تازه کنارِ سایت بنشیند.
      - name: تازه‌سازیِ سایت با فایلِ نصبِ تازه
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --ref main \
            && echo "دیپلوی سایت صدا زده شد" \
            || echo "::warning::دیپلوی سایت صدا زده نشد — سایت با دیپلوی بعدی تازه می‌شود"
