name: ساخت برنامهٔ نیتیو (ویندوز)

# ══ چرا این ورک‌فلو هست ══════════════════════════════════════════════════════
# خواستهٔ صاحب ریپو: «هر تغییر این‌جا می‌دهم آن‌جا هم برود» و «هر بار دانلودِ
# کامل وقت و نت می‌گیرد».
#
# پس: با هر تغییری در پوشهٔ native روی main، برنامه ساخته می‌شود و به‌عنوان
# «آخرین نسخه» منتشر می‌شود. کاربر فقط یک‌بار دانلود می‌کند؛ از آن به بعد خودِ
# برنامه (تنظیمات › به‌روزرسانی) نسخهٔ تازه را می‌گیرد و جایگزین می‌کند.
#
# ── دو معماری، نه یکی ───────────────────────────────────────────────────────
# خواستهٔ صاحب ریپو (۱۴۰۵/۰۷/۱۲): «برنامه رو نمیشه هر سه مدل شد؟ ۳۲ بیت،
# ۶۴ بیت و ۸۶ بیت، چون کامپیوتر خیلی نسخه قدیمی است.»
#
# ⚠️ «۸۶ بیت» وجود ندارد — x86 **همان ۳۲بیتی** است. پس دو مدل است، نه سه:
#
#     win-x64   ویندوزِ ۶۴بیتی   ← همان چیزی که تا امروز منتشر می‌شد
#     win-x86   ویندوزِ ۳۲بیتی   ← تازه، برای کامپیوترِ قدیمی
#
# ⛔ و نامِ فایل‌های ۶۴بیتی **یک حرف هم عوض نشد** (`PumpYaqobi-Setup.exe` ·
#    `base.txt`). هر نصبی که همین حالا دستِ مشتری است کدِ قدیمی دارد و همان
#    نام‌ها را می‌خواند؛ عوض کردنشان یعنی همهٔ آن نصب‌ها یک‌شبه از
#    به‌روزرسانی می‌افتند. ۳۲بیتی پسوندِ `-x86` می‌گیرد.
#
# ── بسته‌های هر معماری ──────────────────────────────────────────────────────
#   PumpYaqobi-Setup.exe        ← ۶۴بیتی؛ این همانی است که بیشترِ کاربران می‌گیرند
#   PumpYaqobi-Setup-x86.exe    ← ۳۲بیتی؛ برای ویندوزِ قدیمیِ ۳۲بیتی
#   PumpYaqobi-app-<id>.zip     ← بستهٔ کوچکِ به‌روزرسانی (شناسهٔ پایه در نامش)
#   PumpYaqobi-Windows[-x86].zip← بستهٔ بی‌نصب، برای کسی که نمی‌خواهد نصب کند
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # شمارهٔ نسخه از ‎native/VERSION‎ و شمارهٔ همین ساخت می‌آید، پس همیشه از
      # قبلی بزرگ‌تر است و به‌روزرسانیِ داخلِ برنامه (که نسخه‌ها را عددی
      # مقایسه می‌کند) می‌فهمد نسخهٔ تازه‌ای آمده. توضیحِ عددها در همان فایل.
      - name: شمارهٔ نسخه
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          source native/VERSION
          patch=$(( GITHUB_RUN_NUMBER - RUN_OFFSET ))
          if [ "$patch" -lt 1 ]; then patch=1; fi
          echo "version=${MAJOR_MINOR}.${patch}" >> "$GITHUB_OUTPUT"
          echo "نسخهٔ این ساخت: ${MAJOR_MINOR}.${patch}"

      - name: آزمون‌ها
        working-directory: native
        run: dotnet test PumpYaqobi.Tests -c Release --nologo

      # self-contained تا روی ویندوزی که دات‌نت ندارد هم باز شود
      #
      # ⚠️ هر معماری پوشهٔ خودش را می‌گیرد (‎publish/win-x64‎ و
      #    ‎publish/win-x86‎). یک پوشهٔ مشترک یعنی فایل‌های بومیِ دو معماری
      #    روی هم می‌نشینند و بستهٔ به‌دست‌آمده روی **هیچ‌کدام** بالا نمی‌آید.
      #
      # ══ ریشه‌های اعتماد، داخلِ خودِ فایلِ برنامه ══════════════════════════
      #  ‎LICENSE_PUBLIC_KEYS‎ (متغیرِ مخزن): کلیدهای عمومیِ امضای مجوز،
      #  «kid=SPKI;kid2=SPKI2» ⇒ ‎CloudConfig.LicenseKeys‎. با پر بودنش کلیدِ
      #  ‎settings.json‎ دیگر ریشهٔ اعتماد نیست.
      #  ‎UPDATE_PUBLIC_KEY‎: کلیدِ عمومیِ P-256 (SPKIِ base64) که امضای
      #  ‎SHA256SUMS.txt.sig‎ را می‌سنجد ⇒ ‎UpdateService‎.
      #  ⚠️ هر دو اختیاری‌اند: خالی ⇒ TOFU و فقط-هش، همان رفتارِ دیروز — و
      #  ساخت **نمی‌شکند**.
      #  ⚠️ خطِ فرمانِ MSBuild «;» و «,» را جداکنندهٔ خاصیت‌ها می‌خواند، پس
      #  به «|» برگردانده می‌شوند (کد همه را می‌پذیرد).
      - name: ساخت
        working-directory: native
        shell: pwsh
        env:
          LICENSE_PUBLIC_KEYS: ${{ vars.LICENSE_PUBLIC_KEYS }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          $lk = ("$env:LICENSE_PUBLIC_KEYS" -replace '[;,\s]+', '|').Trim('|')
          $uk = ("$env:UPDATE_PUBLIC_KEY").Trim()
          $trust = @()
          if ($lk) { $trust += "-p:LicenseKeys=$lk" } else { Write-Host "::notice::LICENSE_PUBLIC_KEYS خالی است — مجوز با TOFU سنجیده می‌شود" }
          if ($uk) { $trust += "-p:UpdateKey=$uk" }   else { Write-Host "::notice::UPDATE_PUBLIC_KEY خالی است — به‌روزرسانی فقط با هش سنجیده می‌شود" }
          foreach ($rid in @('win-x64','win-x86')) {
            dotnet publish PumpYaqobi.App -c Release -r $rid --self-contained true `
              -p:Version=${{ steps.ver.outputs.version }} `
              -p:PublishSingleFile=false `
              @trust `
              -o "publish/$rid"
            if ($LASTEXITCODE -ne 0) { throw "ساختِ $rid شکست خورد" }
          }

      # ── چیدنِ معماریِ بی‌استفادهٔ VLC ─────────────────────────────────────
      #  گزارشِ صاحب ریپو (۱۴۰۵/۰۷/۰۸): «نصب نمی‌شود، چند نسخه قبل‌تر
      #  می‌شد.» و نصاب واقعاً از ~۷۹ مگابایت به ~۱۱۰ پریده بود.
      #
      #  ریشه: `VideoLAN.LibVLC.Windows` بارِ بومیِ **هر دو** معماری را
      #  می‌آورد — `libvlc/win-x64` و `libvlc/win-x86` — و هیچ‌چیز آن یکی را
      #  نمی‌چید. اندازه‌گیری روی خودِ بارِ منتشرشده:
      #
      #      libvlc/win-x64   ۴۲۵ فایل   ۱۰۰٫۸ مگابایت
      #      libvlc/win-x86   ۴۲۵ فایل    ۹۴٫۵ مگابایت
      #      بقیهٔ برنامه     ۲۸۷ فایل   ۱۶۷٫۵ مگابایت
      #
      #  ⛔ و آن یکی **قابلِ استفاده هم نیست**: برنامه با
      #  `--self-contained` و یک RIDِ مشخص منتشر می‌شود، پس بیتیِ پروسه
      #  همان بیتیِ ساخت است؛ و `VlcVideoFeed` هم `Core.Initialize()` را بی
      #  مسیر صدا می‌زند، یعنی LibVLCSharp از بیتیِ خودِ پروسه انتخاب
      #  می‌کند. معماریِ دیگر در چنین پروسه‌ای هرگز بار نمی‌شود.
      #
      #  ⚠️ پس با آمدنِ ساختِ ۳۲بیتی این گام **وارونه** هم می‌شود: در بارِ
      #  ۳۲بیتی آن‌که باید برود `libvlc/win-x64` است. عددِ ثابت ننویسید —
      #  از روی خودِ RID تصمیم بگیرید، وگرنه بارِ ۳۲بیتی همان کتابخانه‌ای
      #  را از دست می‌دهد که لازم دارد و کارتِ دوربین بی‌صدا می‌میرد.
      #
      #  ⚠️ و چرا روی «نصب نمی‌شود» اثر دارد: `SolidCompression=yes` است،
      #  پس کلِ بار یک جریانِ پیوستهٔ فشرده است — هرچه بزرگ‌تر، هم دانلودِ
      #  بیشتری باید بی‌غلط برسد و هم استخراج رَم و وقتِ بیشتری می‌خواهد.
      #  بارِ نیم‌گیگی روی کامپیوترِ ضعیف همان «The source file is
      #  corrupted» را می‌دهد.
      #
      #  ⛔ پیش از گامِ «بسته‌ها» می‌دود، وگرنه هم زیپ و هم نصاب و هم
      #  شناسهٔ پایه از روی درختِ نچیده ساخته می‌شوند.
      - name: چیدنِ معماریِ بی‌استفادهٔ VLC
        shell: pwsh
        working-directory: native
        run: |
          foreach ($rid in @('win-x64','win-x86')) {
            $keep = if ($rid -eq 'win-x86') { 'win-x86' } else { 'win-x64' }
            $drop = if ($rid -eq 'win-x86') { 'win-x64' } else { 'win-x86' }
            $dead = "publish/$rid/libvlc/$drop"
            if (Test-Path $dead) {
              $mb = ((Get-ChildItem $dead -Recurse -File | Measure-Object Length -Sum).Sum)/1MB
              Remove-Item $dead -Recurse -Force
              "[$rid] برداشته شد: {0:N1} مگابایت (libvlc/$drop)" -f $mb
            } else {
              "[$rid] libvlc/$drop نبود — چیزی برداشته نشد"
            }
            #  ⛔ و معماریِ خودش باید سرِ جایش باشد، وگرنه کارتِ دوربین
            #  بی‌صدا می‌میرد. نبودش ساخت را می‌خواباند، نه این‌که رد شود.
            if (-not (Test-Path "publish/$rid/libvlc/$keep/libvlc.dll")) {
              throw "[$rid] libvlc/$keep نیست — پخشِ دوربین از کار می‌افتد"
            }
          }

      # ── دو بسته برای هر معماری، نه یکی ──────────────────────────────────
      # بستهٔ کامل ~۵۷ مگابایت است ولی از هر ساخت به ساختِ بعدی معمولاً فقط
      # دو مگابایتش عوض می‌شود (خودِ فایل‌های برنامه). پس یک بستهٔ کوچک هم
      # ساخته می‌شود که برنامه در به‌روزرسانی‌های بعدی همان را می‌گیرد — تا
      # هر بار ۵۷ مگابایت نت مصرف نشود.
      #
      # «شناسهٔ پایه» از فایل‌های ثابت (دات‌نت، اِوالونیا، اسکیا و …) ساخته
      # می‌شود و در نامِ بستهٔ کوچک می‌نشیند. برنامه فقط وقتی بستهٔ کوچک را
      # می‌گیرد که پایه‌اش دقیقاً همان باشد؛ اگر نسخهٔ کتابخانه‌ها عوض شده
      # باشد شناسه فرق می‌کند و خودبه‌خود بستهٔ کامل گرفته می‌شود.
      #
      # ⚠️ و همین شناسه **دو معماری را هم از هم جدا می‌کند**: فایل‌های بومیِ
      #    ۳۲ و ۶۴بیتی هش و اندازه‌شان فرق دارد، پس شناسهٔ پایه‌شان هرگز یکی
      #    نمی‌شود و نصبِ ۳۲بیتی نمی‌تواند بستهٔ کوچکِ ۶۴بیتی را بردارد.
      #    این یک اتفاق نیست، خودِ قاعده است — و آزمون قفلش کرده.
      - name: بسته‌ها
        id: pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path rel | Out-Null

          foreach ($rid in @('win-x64','win-x86')) {
            $pub = "native/publish/$rid"
            # ⛔ پسوند فقط برای ۳۲بیتی. نامِ ۶۴بیتی همان است که بوده، وگرنه
            #    هر نصبِ امروزیِ مشتری از به‌روزرسانی می‌افتد.
            $sfx = if ($rid -eq 'win-x86') { '-x86' } else { '' }

            # فایل‌های خودِ برنامه در برابر فایل‌های پایه
            $app  = Get-ChildItem $pub -File | Where-Object { $_.Name -like 'PumpYaqobi*' }
            $base = Get-ChildItem $pub -Recurse -File | Where-Object { $_.Name -notlike 'PumpYaqobi*' }

            $sb = [System.Text.StringBuilder]::new()
            foreach ($f in ($base | Sort-Object FullName)) {
              $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
              [void]$sb.AppendLine("$($f.Name):$($f.Length):$h")
            }
            $bytes  = [System.Text.Encoding]::UTF8.GetBytes($sb.ToString())
            $sha    = [System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes)
            $baseId = -join ($sha[0..3] | ForEach-Object { $_.ToString('x2') })

            # شناسه کنارِ برنامه می‌نشیند تا نصبِ کاربر بداند پایه‌اش کدام است
            $baseId | Out-File -Encoding ascii -NoNewline "$pub/base.id"

            Compress-Archive -Path "$pub/*" -DestinationPath "rel/PumpYaqobi-Windows$sfx.zip" -Force
            Compress-Archive -Path $app.FullName -DestinationPath "rel/PumpYaqobi-app-$baseId.zip" -Force
            # شناسهٔ پایه کنارِ نسخه هم منتشر می‌شود: درِ دومِ به‌روزرسانی هیچ
            # پرس‌وجویی نمی‌زند، پس باید از روی همین فایل بفهمد نامِ بستهٔ کوچک
            # چیست و آیا با پایهٔ نصبِ کاربر یکی است یا نه.
            $baseId | Out-File -Encoding ascii -NoNewline "rel/base$sfx.txt"

            if ($rid -eq 'win-x86') {
              echo "baseId86=$baseId" >> $env:GITHUB_OUTPUT
            } else {
              echo "baseId=$baseId" >> $env:GITHUB_OUTPUT
            }

            "[$rid] بستهٔ کامل: {0:N1} مگابایت" -f ((Get-Item "rel/PumpYaqobi-Windows$sfx.zip").Length/1MB)
            "[$rid] بستهٔ کوچک: {0:N1} مگابایت ($baseId)" -f ((Get-Item "rel/PumpYaqobi-app-$baseId.zip").Length/1MB)
          }

          "${{ steps.ver.outputs.version }}" | Out-File -Encoding ascii rel/version.txt

          # ⛔ دو شناسهٔ پایهٔ یکسان یعنی نصبِ ۳۲بیتی می‌تواند بستهٔ ۶۴بیتی را
          #    بردارد و برنامه دیگر بالا نمی‌آید. شدنی نیست، ولی «شدنی نیست»
          #    با «سنجیده شد» یکی نیست.
          $a = Get-Content rel/base.txt -Raw
          $b = Get-Content rel/base-x86.txt -Raw
          if ($a -eq $b) { throw "شناسهٔ پایهٔ ۳۲ و ۶۴بیتی یکی درآمد — بستهٔ کوچک قاطی می‌شود" }

      # ── نصاب ────────────────────────────────────────────────────────────
      # تا امروز فقط زیپ منتشر می‌شد و کاربر باید خودش بازش می‌کرد و دنبالِ
      # exe می‌گشت؛ نه آیکونی روی دسکتاپ می‌آمد نه در فهرستِ برنامه‌ها بود.
      # Inno Setup روی رانرِ ویندوزِ گیت‌هاب از پیش هست.
      #
      # ⛔ دو نصابِ جدا با دو AppId جدا: نصبِ ۳۲بیتی نباید روی نصبِ ۶۴بیتی
      #    بنشیند. Inno فایل‌های کهنه را پاک نمی‌کند، پس نشستنشان روی هم یعنی
      #    پوشه‌ای با بارِ بومیِ هر دو معماری و ~۱۰۰ مگابایت آشغال.
      - name: ساختِ نصاب
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Force -Path rel | Out-Null
          foreach ($arch in @('x64','x86')) {
            $rid = "win-$arch"
            & $iscc /Qp `
              "/DAppVersion=${{ steps.ver.outputs.version }}" `
              "/DArch=$arch" `
              "/DSourceDir=..\publish\$rid" `
              native/installer/PumpYaqobi.iss
            if ($LASTEXITCODE -ne 0) { throw "ساختِ نصابِ $arch شکست خورد" }
          }
          "نصابِ ۶۴بیتی: {0:N1} مگابایت" -f ((Get-Item rel/PumpYaqobi-Setup.exe).Length/1MB)
          "نصابِ ۳۲بیتی: {0:N1} مگابایت" -f ((Get-Item rel/PumpYaqobi-Setup-x86.exe).Length/1MB)

      # ── چک‌سام ──────────────────────────────────────────────────────────
      #  گزارشِ صاحب ریپو (۱۴۰۵/۰۷/۰۸) با عکس: نصاب وسطِ کار
      #  «The source file is corrupted» داد روی
      #  `System.IO.Compression.Native.dll`، در حالی که اندازهٔ فایلِ
      #  دانلودشده مو‌به‌مو با اندازهٔ منتشرشده یکی بود.
      #
      #  ⛔ و هیچ راهی نبود بفهمیم خرابی از دانلود است یا از خودِ ساخت —
      #  چون این انتشار هیچ چک‌سامی نداشت. ریپوی `server` از قبل
      #  `SHA256SUMS.txt` می‌دهد و همان‌جا این پرسش یک دستور است، نه حدس.
      #
      #  ⚠️ و چرا مهم است: `SolidCompression=yes` یعنی همهٔ فایل‌ها در یک
      #  جریانِ پیوستهٔ فشرده‌اند، پس **یک بایتِ خراب** هر فایلی را که بعد
      #  از آن نقطه بیاید «corrupted» می‌کند. یعنی نامِ فایلِ داخلِ پیام
      #  جای خرابی را نشان نمی‌دهد و دنبالش گشتن وقت تلف کردن است.
      #
      #  ⚠️ پس از ساختِ نصاب می‌دود، نه در گامِ «بسته‌ها»: خودِ نصاب هم
      #  باید در فهرست باشد.
      - name: چک‌سام‌ها
        shell: pwsh
        run: |
          $names = @(
            'PumpYaqobi-Setup.exe',
            'PumpYaqobi-Setup-x86.exe',
            'PumpYaqobi-Windows.zip',
            'PumpYaqobi-Windows-x86.zip',
            "PumpYaqobi-app-${{ steps.pack.outputs.baseId }}.zip",
            "PumpYaqobi-app-${{ steps.pack.outputs.baseId86 }}.zip"
          )
          $lines = foreach ($n in $names) {
            $f = "rel/$n"
            if (Test-Path $f) {
              $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
              "$h  $n"
            }
          }
          #  ⚠️ بی BOM و با خطِ LF — وگرنه `sha256sum -c` روی لینوکس/مک
          #  همان خطِ اول را «improperly formatted» می‌خواند.
          $text = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'rel/SHA256SUMS.txt'), $text,
            (New-Object System.Text.UTF8Encoding $false))
          Get-Content rel/SHA256SUMS.txt

      #  ══ امضای فهرستِ چک‌سام (اختیاری) ════════════════════════════════════
      #  برنامه پیش از نصبِ هر به‌روزرسانی هشِ بسته را با همین فهرست می‌سنجد
      #  (`UpdateService`). اگر `UPDATE_PUBLIC_KEY` در ساخت نشسته باشد، امضای
      #  همین فهرست هم **لازم** است — پس کلیدِ خصوصیِ جفتش (رازِ
      #  `UPDATE_SIGNING_KEY`، PEMِ P-256) همین‌جا `SHA256SUMS.txt.sig` را
      #  می‌سازد: ES256، خامِ P1363 (۶۴ بایت) روی بایت‌های **دقیقِ** فایل.
      #  ⚠️ با خودِ دات‌نتِ pwsh امضا می‌شود، نه openssl — همان الگوریتم، بی
      #  وابستگی به این‌که رانر openssl را در PATH داشته باشد.
      #  ⚠️ رازِ خالی ⇒ امضایی ساخته نمی‌شود و ساخت **نمی‌شکند** (حالتِ
      #  فقط-هش). ولی اگر کلیدِ عمومی هست و راز نیست، نسخهٔ منتشرشده به‌روز
      #  نمی‌شود — پس همین‌جا هشدار می‌دهد.
      - name: امضای چک‌سام‌ها
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          if (-not "$env:UPDATE_SIGNING_KEY".Trim()) {
            if ("$env:UPDATE_PUBLIC_KEY".Trim()) {
              Write-Host "::warning::UPDATE_PUBLIC_KEY هست ولی رازِ UPDATE_SIGNING_KEY نیست — این نسخه امضا ندارد و برنامه نصبش نمی‌کند"
            }
            exit 0
          }
          $ec = [System.Security.Cryptography.ECDsa]::Create()
          $ec.ImportFromPem($env:UPDATE_SIGNING_KEY)
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD 'rel/SHA256SUMS.txt'))
          $sig = $ec.SignData($bytes, [System.Security.Cryptography.HashAlgorithmName]::SHA256,
                              [System.Security.Cryptography.DSASignatureFormat]::IeeeP1363FixedFieldConcatenation)
          [System.IO.File]::WriteAllBytes((Join-Path $PWD 'rel/SHA256SUMS.txt.sig'), $sig)
          if ("$env:UPDATE_PUBLIC_KEY".Trim()) {
            $pub = [System.Security.Cryptography.ECDsa]::Create()
            $read = 0
            $pub.ImportSubjectPublicKeyInfo([Convert]::FromBase64String("$env:UPDATE_PUBLIC_KEY".Trim()), [ref]$read)
            if (-not $pub.VerifyData($bytes, $sig, [System.Security.Cryptography.HashAlgorithmName]::SHA256,
                                     [System.Security.Cryptography.DSASignatureFormat]::IeeeP1363FixedFieldConcatenation)) {
              throw "امضای SHA256SUMS.txt با UPDATE_PUBLIC_KEY نمی‌خورد — جفتِ کلیدها یکی نیستند"
            }
          }
          Write-Host "SHA256SUMS.txt امضا شد ($($sig.Length) بایت)"

      - name: انتشار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: پمپ یعقوبی — نسخهٔ ${{ steps.ver.outputs.version }}
          body: |
            برنامهٔ کامپیوتریِ پمپ یعقوبی، نسخهٔ ${{ steps.ver.outputs.version }}.

            ### کدام فایل را بگیرم؟

            | ویندوزِ شما | فایل |
            |---|---|
            | ۶۴بیتی (تقریباً همهٔ کامپیوترهای امروزی) | **`PumpYaqobi-Setup.exe`** |
            | ۳۲بیتی (کامپیوترِ قدیمی) | **`PumpYaqobi-Setup-x86.exe`** |

            بیتیِ ویندوزتان را این‌طور ببینید: کلیدِ **ویندوز + Pause**، یا
            «تنظیمات › سیستم › درباره» — جلوی «نوع سیستم» نوشته است
            «۶۴-bit» یا «۳۲-bit».

            ⚠️ نمی‌دانید کدام؟ **`PumpYaqobi-Setup.exe`** را بگیرید. اگر
            ویندوزتان ۳۲بیتی باشد، ویندوز همان لحظه می‌گوید این برنامه روی
            این کامپیوتر اجرا نمی‌شود — و آن‌وقت فایلِ `-x86` را بگیرید.
            برعکسش خرابی نمی‌آورد ولی برنامه کندتر می‌شود، پس روی ویندوزِ
            ۶۴بیتی همان اولی درست است.

            ⚠️ هر دو **یک برنامهٔ کاملاً یکسان**‌اند؛ فقط برای بیتیِ متفاوتِ
            ویندوز ساخته شده‌اند. حساب‌ها و دفتر در هر دو یکی است.

            ### نصب

            فایل را بگیرید و بزنید.

            وسطِ نصب **خودتان انتخاب می‌کنید فایل‌ها کجا بروند**. پیش‌فرض
            `%LocalAppData%\Programs\PumpYaqobi` است — همان‌جایی که کروم و
            وی‌اس‌کد هم می‌نشینند — و همان بهترین انتخاب است، چون برنامه
            خودش را به‌روز می‌کند و آن پوشه اجازهٔ مدیر نمی‌خواهد. اگر جای
            دیگری مثلِ `Program Files` را بخواهید هم می‌شود؛ فقط نصاب همان‌جا
            به شما می‌گوید که از آن به بعد هر به‌روزرسانی اجازهٔ مدیر می‌پرسد.

            بعدش آیکون روی **دسکتاپ** می‌گذارد، در **فهرستِ برنامه‌ها** می‌آید،
            و در «برنامه‌ها و قابلیت‌ها» ثبت می‌شود تا هر وقت خواستید بشود
            حذفش کرد. دات‌نت هم لازم ندارد — همه‌چیز داخلِ خودِ نصاب است.

            ### حساب‌های شما

            دیتابیس در `%AppData%\PumpYaqobi` می‌ماند، بیرونِ پوشهٔ نصب. پس
            به‌روزرسانی و حتی حذفِ برنامه هیچ دستی به حساب‌ها نمی‌زند.

            ### بارهای بعد

            لازم نیست چیزی دانلود کنید. از داخلِ برنامه «تنظیمات ›
            به‌روزرسانی» را بزنید — خودش می‌گیرد، جایگزین می‌کند و دوباره باز
            می‌شود؛ و فقط همان چند مگابایتی که واقعاً عوض شده، نه کلِ بسته.
            هر نصب، بستهٔ **بیتیِ خودش** را می‌گیرد.

            نصبِ دوباره به **همان پوشه‌ای** می‌رود که بارِ اول انتخاب کردید، و
            بعد از باز شدنِ دوباره خودِ برنامه می‌گوید که واقعاً به نسخهٔ تازه
            رسیده یا نه — اگر نرسیده باشد، ساکت نمی‌ماند.

            ---
            `PumpYaqobi-Windows.zip` (و `-x86`ی‌اش) هم معمولاً هست، برای کسی
            که نصب نمی‌خواهد و ترجیح می‌دهد خودش جایی بازش کند. آن فایل بزرگ
            است و گاهی بالا رفتنش نیمه‌کاره می‌ماند؛ اگر در فهرستِ پایین
            ندیدیدش، همان نصاب را بگیرید — همان کارِ کامل را می‌کند.
          #  ⛔ زیپِ ۱۷۰ مگابایتیِ «بی‌نصاب» عمداً این‌جا نیست — گامِ بعدی.
          #
          #  دو بار پشتِ سرِ هم (۱۴۰۵/۰۶/۳۰) همین گام روی همان یک فایل
          #  «Headers Timeout» خورد: سه فایلِ دیگر بالا رفته بودند و
          #  `PumpYaqobi-Setup.exe` — یعنی خودِ محصول — آماده بود، ولی چون
          #  آپلودِ چهارمی مرد، **کلِ انتشار پیش‌نویس ماند و به دستِ هیچ
          #  مشتری‌ای نرسید**. یک بار ۳۵ دقیقه و بارِ دوم ۳۲ دقیقه.
          #
          #  فایلی که «راحتی» است نباید جلوی فایلی را که «محصول» است بگیرد.
          files: |
            rel/PumpYaqobi-Setup.exe
            rel/PumpYaqobi-Setup-x86.exe
            rel/PumpYaqobi-app-${{ steps.pack.outputs.baseId }}.zip
            rel/PumpYaqobi-app-${{ steps.pack.outputs.baseId86 }}.zip
            rel/version.txt
            rel/SHA256SUMS.txt
            rel/SHA256SUMS.txt.sig
          make_latest: true

      #  ⚠️ و زیپِ بزرگ جداگانه و **بی حقِ شکستن**: اگر شبکهٔ گیت‌هاب باز هم
      #  وسطِ راه مرد، انتشار سرِ جایش است و فقط این یک فایل کم دارد —
      #  که با یک اجرای دوباره اضافه می‌شود. متنِ انتشار هم همین را می‌گوید.
      #  ══ درِ دومِ به‌روزرسانی ═════════════════════════════════════════════
      #  برچسبِ چرخشی: نشانیِ فایل‌هایش ثابت است، پس برنامه می‌تواند بی هیچ
      #  پرس‌وجویی «آخرین نسخه چند است» را بخواند. لازم بود چون تنها راهِ
      #  برنامه فهرستِ انتشار بود و آن یکی سقفِ نرخ دارد و روی بعضی
      #  شبکه‌ها اصلاً باز نمی‌شود — و برنامه همان را «به‌روز است» می‌خواند.
      #  همین برچسب است که سایت هم برای دکمهٔ دانلودِ ویندوز می‌خواندش
      #  (`deploy-pages.yml`)؛ تا امروز ساخته نمی‌شد و آن دکمه مرده بود.
      #
      #  ⛔ prerelease و make_latest: false هر دو لازم‌اند. برچسبِ بی‌شماره
      #  اگر «تازه‌ترین انتشار» شود، برنامه از آن هیچ شماره‌ای درنمی‌آورد و
      #  برای همیشه می‌گوید «به‌روز است». همان تله‌ای که ریپوی سرور یک بار
      #  با انتشارِ اپِ اندروید خورد.
      #
      #  ⛔ و `base.txt` همان ۶۴بیتی می‌ماند. نصب‌های امروزیِ مشتری کدِ قدیمی
      #  دارند و همین یک نام را می‌شناسند؛ ۳۲بیتی `base-x86.txt`ی خودش را
      #  دارد و کدِ تازه از روی بیتیِ خودش انتخاب می‌کند.
      - name: انتشارِ چرخشی (درِ دومِ به‌روزرسانی)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: پمپ یعقوبی — آخرین نسخهٔ کامپیوتر
          body: |
            همیشه روی تازه‌ترین ساخت می‌نشیند — نسخهٔ
            ${{ steps.ver.outputs.version }}.

            برنامه وقتی فهرستِ انتشارها در دسترس نباشد از همین‌جا
            می‌خواند، و دکمهٔ دانلودِ ویندوزِ سایت هم از همین‌جا پر می‌شود.

            `PumpYaqobi-Setup.exe` ۶۴بیتی است و
            `PumpYaqobi-Setup-x86.exe` ۳۲بیتی.
          prerelease: true
          make_latest: false
          files: |
            rel/PumpYaqobi-Setup.exe
            rel/PumpYaqobi-Setup-x86.exe
            rel/PumpYaqobi-app-${{ steps.pack.outputs.baseId }}.zip
            rel/PumpYaqobi-app-${{ steps.pack.outputs.baseId86 }}.zip
            rel/version.txt
            rel/base.txt
            rel/base-x86.txt
            rel/SHA256SUMS.txt
            rel/SHA256SUMS.txt.sig

      - name: انتشارِ زیپِ بی‌نصاب (اختیاری)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: |
            rel/PumpYaqobi-Windows.zip
            rel/PumpYaqobi-Windows-x86.zip
