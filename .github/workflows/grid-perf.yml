name: سنجشِ کاراییِ جدول‌ها

# ══ چرا این ورک‌فلو هست ══════════════════════════════════════════════════════
# خواستهٔ صریحِ صاحب ریپو: «عملکرد باید واقعاً آزمایش شود، نه اینکه فقط در کد
# ادعا شود». پس با ۱۰۰۰ تا یک میلیون ردیف، جدولِ واقعی در پنجرهٔ واقعی ساخته
# می‌شود و شمرده می‌شود که چند ردیفِ زنده در درختِ بصری هست.
#
# اگر روزی کسی سقفِ ارتفاعِ جدول را بردارد، مجازی‌سازی می‌میرد و همین‌جا
# قرمز می‌شود — نه شش ماه بعد روی کامپیوترِ کاربر.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'native/**'
      - '.github/workflows/grid-perf.yml'

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: سنجش
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- gridperf

      - name: سنجشِ فهرست‌های کارتی
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- cardperf

      # ══ سه بخشی که صاحب ریپو گفت «خیلی دیر باز می‌شوند» ═══════════════════
      # گاوصندوق، صرافی و مصارف — با دادهٔ **واقعاً دیده‌شونده**.
      # ⚠️ سنجشِ پایینی این سه را سال‌ها خالی می‌سنجید، چون دادهٔ آزمونش
      # ‎MonthKey‎ نداشت و این بخش‌ها ماه‌به‌ماه فیلتر می‌شوند.
      - name: گاوصندوق، صرافی و مصارف
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- ledgerperf

      # ══ کند نشدن با دادهٔ واقعاً بزرگ ═══════════════════════════════════════
      # خواستهٔ صاحب ریپو: «حتی با ده هزار قرض‌دار و صدهزار ردیف در یک حساب
      # نباید کند شود.» این‌جا همان دیتابیس ساخته می‌شود و زمانِ باز شدنِ
      # بخش‌ها و حساب‌ها گرفته می‌شود.
      - name: کند نشدن با دادهٔ بزرگ
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- perf

      # ══ «موقعِ اسکرول لگ می‌زند» ═══════════════════════════════════════════
      # گزارشِ صاحب ریپو (۱۴۰۵/۰۶/۲۶). صفحه چرخ‌به‌چرخ پایین می‌رود و هر گام
      # سنجیده می‌شود: اسکرولِ جدولِ ساخته‌شده باید زیرِ ‎Broken‎ بماند و هیچ
      # تکهٔ رشدی از ‎GrowBroken‎ نگذرد. ریشهٔ بارِ اول: سایهٔ محوِ کادرِ صفحه‌قد.
      - name: اسکرولِ بی‌لگ
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- scrollperf
