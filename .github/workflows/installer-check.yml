name: سنجشِ نصاب (ویندوز)

# ══ چرا این ورک‌فلو هست ══════════════════════════════════════════════════════
# نسخهٔ ۳.۱.۱۵۸ هیچ‌وقت منتشر نشد: در ‎[Code]‎ی نصاب یک توضیح با «;» بود و
# ‎ISCC‎ می‌ایستاد — ولی چون ‎build-native.yml‎ فقط **پس از** مرج می‌دود، کسی
# نفهمید. هر فایلی که فقط پس از مرج ساخته می‌شود، سنجهٔ **پیش از** مرج
# می‌خواهد. این‌جا همان نصاب، با همان اسکریپت، روی همان ویندوزِ رانر ساخته
# می‌شود — با بارِ ساختگی، چون کامپایلِ ‎ISCC‎ به محتوای فایل‌ها کاری ندارد.
#
# ── و از ۱۴۰۵/۰۷/۱۴ فقط ساخته نمی‌شود، **اجرا** هم می‌شود ───────────────────
# خواستهٔ صاحب ریپو: «۳۲ و ۶۴ توی یک فایل باشن، انتخابی باشه و کار هم کنه —
# حدس نباشه.» پس همان نصابِ ساخته‌شده روی رانر بی‌صدا نصب می‌شود و سنجیده
# می‌شود که **کدام بار** روی دیسک نشست:
#   /ARCH=x86  ⇒ فایلِ ۳۲بیتی، پوشهٔ VLCِ ۳۲
#   /ARCH=x64  ⇒ فایلِ ۶۴بیتی، پوشهٔ VLCِ ۶۴، و پوشهٔ VLCِ ۳۲ برداشته شده
#   بی /ARCH   ⇒ همان معماریِ نصبِ پیشین (رجیستری)، نه چیزِ دیگر
#   و حذفِ بی‌صدا فایل‌ها را می‌برد و پوشهٔ داده را دست نمی‌زند.
#   و نصابِ تازه‌تر بی /DIR همان نصب را به‌روز می‌کند و نصابِ کهنه‌تر رد می‌شود.
# ⚠️ صفحهٔ انتخاب خودش این‌جا دیده نمی‌شود (بی‌صدا)، ولی همان ‎PickedArch‎ که
# صفحه به آن می‌نویسد این‌جا از ‎/ARCH‎ می‌خواند — یک تصمیم، یک جا.

on:
  pull_request:
    paths:
      - 'native/installer/**'
      - '.github/workflows/build-native.yml'
      - '.github/workflows/installer-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iscc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: ساختِ نصاب با دو بارِ ساختگی
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          foreach ($arch in @('x64','x86')) {
            $src = "fake\win-$arch"
            New-Item -ItemType Directory -Force -Path "$src\libvlc\win-$arch" | Out-Null
            #  محتوای هر بار نامِ معماری‌اش است — تا بعد از نصب معلوم باشد کدام نشست
            Set-Content -Path "$src\PumpYaqobi.exe" -Value $arch -NoNewline
            Set-Content -Path "$src\shared.dll" -Value "shared-$arch" -NoNewline
            Set-Content -Path "$src\libvlc\win-$arch\libvlc.dll" -Value $arch -NoNewline
          }
          #  فایل‌های ویژهٔ هر معماری که همتای هم‌نام ندارند — همان نام‌های ساختِ واقعی
          Set-Content -Path "fake\win-x86\libgcc_s_dw2-1.dll" -Value 'x86' -NoNewline
          Set-Content -Path "fake\win-x86\mscordaccore_x86_x86_8.0.1.dll" -Value 'x86' -NoNewline
          Set-Content -Path "fake\win-x64\libgcc_s_seh-1.dll" -Value 'x64' -NoNewline
          Set-Content -Path "fake\win-x64\mscordaccore_amd64_amd64_8.0.1.dll" -Value 'x64' -NoNewline
          #  دو نسخه از همان نصاب: 0.0.1 (rel) و 0.0.2 (rel-new) — هر کدام با
          #  «ver.txt»ِ خودش تا معلوم باشد کدام روی دیسک نشست.
          foreach ($v in @('0.0.1','0.0.2')) {
            foreach ($arch in @('x64','x86')) { Set-Content -Path "fake\win-$arch\ver.txt" -Value $v -NoNewline }
            $out = if ($v -eq '0.0.1') { "$PWD\rel" } else { "$PWD\rel-new" }
            & $iscc /Qp "/DAppVersion=$v" "/DSourceDir64=..\..\fake\win-x64" "/DSourceDir86=..\..\fake\win-x86" "/O$out" native/installer/PumpYaqobi.iss
            if ($LASTEXITCODE -ne 0) { throw "ساختِ نصابِ $v شکست خورد" }
          }
          Get-ChildItem rel, rel-new | ForEach-Object { "{0}  {1:N0} بایت" -f $_.FullName, $_.Length }

      - name: اجرای واقعیِ نصاب — ۳۲، بعد ۶۴، بعد بی‌گفتن، بعد حذف
        shell: pwsh
        run: |
          $setup = (Resolve-Path rel\PumpYaqobi-Setup.exe).Path
          $dir = Join-Path $env:TEMP "pyq-check"
          $log = Join-Path $env:TEMP "pyq-setup.log"
          function Install($archArg) {
            $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$log")
            if ($archArg) { $args += "/ARCH=$archArg" }
            $p = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log | Select-Object -Last 40; throw "نصاب با کدِ $($p.ExitCode) بیرون آمد (ARCH=$archArg)" }
          }
          function Landed() { Get-Content (Join-Path $dir 'PumpYaqobi.exe') -Raw }
          function Fail($m) { Get-Content $log | Select-Object -Last 40; throw $m }

          #  دفترِ کاربر پیش از هر نصبی — سوییچِ ۳۲ ⇄ ۶۴ نباید یک بیتش را عوض کند
          $data0 = Join-Path $env:APPDATA 'PumpYaqobi'
          New-Item -ItemType Directory -Force -Path $data0 | Out-Null
          Set-Content -Path "$data0\pump.db" -Value 'ledger' -NoNewline

          # ۱) ۳۲بیتی
          Install 'x86'
          if ((Landed) -ne 'x86') { Fail "با /ARCH=x86 بارِ «$(Landed)» نشست" }
          if (-not (Test-Path "$dir\libvlc\win-x86\libvlc.dll")) { Fail "پوشهٔ VLCِ ۳۲ نیامد" }
          if ((Get-Content "$dir\shared.dll" -Raw) -ne 'shared-x86') { Fail "فایلِ هم‌نام از بارِ ۳۲ نیست" }
          $reg = Get-ItemPropertyValue -Path 'HKCU:\Software\PumpYaqobi' -Name Arch
          if ($reg -ne 'x86') { Fail "رجیستری «$reg» گفت، نه x86" }
          "✔ /ARCH=x86 ⇒ بارِ ۳۲بیتی نشست"

          # ۲) بی /ARCH روی نصبِ ۳۲بیتی ⇒ همان ۳۲ می‌ماند (به‌روزرسانیِ بی‌صدا معماری را عوض نمی‌کند)
          Install $null
          if ((Landed) -ne 'x86') { Fail "به‌روزرسانیِ بی‌صدا معماری را به «$(Landed)» عوض کرد" }
          "✔ بی /ARCH ⇒ همان ۳۲بیتیِ پیشین ماند"

          # ۳) ۶۴بیتی روی همان پوشه ⇒ بارِ ۶۴ و پوشهٔ VLCِ ۳۲ برداشته شده
          Install 'x64'
          if ((Landed) -ne 'x64') { Fail "با /ARCH=x64 بارِ «$(Landed)» نشست" }
          if ((Get-Content "$dir\shared.dll" -Raw) -ne 'shared-x64') { Fail "فایلِ هم‌نام روی‌نویسی نشد" }
          if (-not (Test-Path "$dir\libvlc\win-x64\libvlc.dll")) { Fail "پوشهٔ VLCِ ۶۴ نیامد" }
          if (Test-Path "$dir\libvlc\win-x86") { Fail "پوشهٔ VLCِ ۳۲ پس از رفتن به ۶۴ ماند" }
          $reg = Get-ItemPropertyValue -Path 'HKCU:\Software\PumpYaqobi' -Name Arch
          if ($reg -ne 'x64') { Fail "رجیستری «$reg» گفت، نه x64" }
          foreach ($f in 'libgcc_s_dw2-1.dll','mscordaccore_x86_x86_8.0.1.dll') {
            if (Test-Path "$dir\$f") { Fail "فایلِ ویژهٔ ۳۲بیتی «$f» پس از رفتن به ۶۴ ماند" } }
          if (-not (Test-Path "$dir\libgcc_s_seh-1.dll")) { Fail "فایلِ ویژهٔ ۶۴بیتی نیامد" }
          if ((Get-Content "$data0\pump.db" -Raw) -ne 'ledger') { Fail "سوییچِ ۳۲ ⇒ ۶۴ به دفترِ کاربر دست زد" }
          "✔ /ARCH=x64 روی نصبِ ۳۲ ⇒ بارِ ۶۴ نشست، بارِ ۳۲ (با فایل‌های ویژه‌اش) رفت، و دفتر دست‌نخورده"

          # ۳ب) برعکس: ۶۴ ⇒ ۳۲ روی همان پوشه، بعد دوباره ۶۴ (برای گام‌های بعد)
          Install 'x86'
          if ((Landed) -ne 'x86') { Fail "با /ARCH=x86 روی نصبِ ۶۴ بارِ «$(Landed)» نشست" }
          if ((Get-Content "$dir\shared.dll" -Raw) -ne 'shared-x86') { Fail "فایلِ هم‌نام به ۳۲ برنگشت" }
          if (-not (Test-Path "$dir\libvlc\win-x86\libvlc.dll")) { Fail "پوشهٔ VLCِ ۳۲ برنگشت" }
          if (Test-Path "$dir\libvlc\win-x64") { Fail "پوشهٔ VLCِ ۶۴ پس از رفتن به ۳۲ ماند" }
          foreach ($f in 'libgcc_s_seh-1.dll','mscordaccore_amd64_amd64_8.0.1.dll') {
            if (Test-Path "$dir\$f") { Fail "فایلِ ویژهٔ ۶۴بیتی «$f» پس از رفتن به ۳۲ ماند" } }
          if (-not (Test-Path "$dir\libgcc_s_dw2-1.dll")) { Fail "فایلِ ویژهٔ ۳۲بیتی برنگشت" }
          if ((Get-ItemPropertyValue -Path 'HKCU:\Software\PumpYaqobi' -Name Arch) -ne 'x86') { Fail "رجیستری پس از ۶۴ ⇒ ۳۲ x86 نشد" }
          if ((Get-Content "$data0\pump.db" -Raw) -ne 'ledger') { Fail "سوییچِ ۶۴ ⇒ ۳۲ به دفترِ کاربر دست زد" }
          $u = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '*8E86F349*' })
          if ($u.Count -ne 1) { Fail "پس از سوییچ دو ثبتِ حذف ساخته شد ($($u.Count))" }
          "✔ /ARCH=x86 روی نصبِ ۶۴ ⇒ بارِ ۳۲ نشست، بارِ ۶۴ (با فایل‌های ویژه‌اش) رفت، دفتر دست‌نخورده، یک نصب"
          Install 'x64'
          if ((Landed) -ne 'x64') { Fail "برگشت به ۶۴ نشد" }
          if (Test-Path "$dir\libgcc_s_dw2-1.dll") { Fail "بارِ دوم هم فایلِ ویژهٔ ۳۲ ماند" }
          "✔ و دوباره ۶۴ — رفت‌وبرگشت تمیز"

          # ۴) یک ردیف در «برنامه‌ها و قابلیت‌ها»، با همان AppId
          $unins = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8E86F349-343C-4FFB-983E-BBDDC5390081}_is1'
          if (-not (Test-Path $unins)) { Fail "ثبتِ حذف با AppIdِ همیشگی نیست" }
          $uninsExe = (Get-ItemPropertyValue -Path $unins -Name UninstallString) -replace '"',''
          "✔ ثبتِ حذف: $uninsExe"

          # ۴ب) نصبِ دوبارهٔ نسخهٔ تازه‌تر **بی /DIR** ⇒ همان نصب را پیدا و به‌روز می‌کند
          #     (خواستهٔ ۱۴۰۵/۰۷/۱۵: «اگر بود همان را آپدیت کند… جدیدها را قبول کند»)
          $newer = (Resolve-Path rel-new\PumpYaqobi-Setup.exe).Path
          #  میان‌برهای نامِ کهنه («پمپ یعقوبی»، پیش از ۱۴۰۵/۰۷/۱۵) — باید بروند
          $desk = [Environment]::GetFolderPath('Desktop')
          $progs = [Environment]::GetFolderPath('Programs')
          Set-Content -Path (Join-Path $desk 'پمپ یعقوبی.lnk') -Value 'old'
          New-Item -ItemType Directory -Force -Path (Join-Path $progs 'پمپ یعقوبی') | Out-Null
          Set-Content -Path (Join-Path $progs 'پمپ یعقوبی\پمپ یعقوبی.lnk') -Value 'old'
          $p = Start-Process -FilePath $newer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "نصابِ تازه‌تر با کدِ $($p.ExitCode) بیرون آمد" }
          if ((Get-Content "$dir\ver.txt" -Raw) -ne '0.0.2') { Fail "نسخهٔ تازه در پوشهٔ نصبِ پیشین ننشست" }
          if ((Get-ItemPropertyValue -Path $unins -Name DisplayVersion) -ne '0.0.2') { Fail "ثبتِ نسخه 0.0.2 نشد" }
          if ((Landed) -ne 'x64') { Fail "به‌روزرسانی معماری را عوض کرد" }
          $dirs = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '*8E86F349*' })
          if ($dirs.Count -ne 1) { Fail "به‌جای به‌روزرسانی، نصبِ دوم ساخته شد ($($dirs.Count))" }
          "✔ نسخهٔ تازه‌تر همان نصب را پیدا کرد و در همان پوشه به‌روز کرد"
          if (Test-Path (Join-Path $desk 'پمپ یعقوبی.lnk')) { Fail "میان‌برِ کهنهٔ «پمپ یعقوبی» روی دسکتاپ ماند" }
          if (Test-Path (Join-Path $progs 'پمپ یعقوبی')) { Fail "گروهِ کهنهٔ «پمپ یعقوبی» در منوی شروع ماند" }
          if (-not (Test-Path (Join-Path $desk 'پمپ بنزین.lnk'))) { Fail "میان‌برِ «پمپ بنزین» روی دسکتاپ نیامد" }
          if ((Get-ItemPropertyValue -Path $unins -Name DisplayName) -ne 'پمپ بنزین') { Fail "نامِ برنامه در ویندوز «پمپ بنزین» نشد" }
          "✔ نامِ برنامه «پمپ بنزین» شد و میان‌برهای «پمپ یعقوبی» رفتند"

          # ۴ج) نسخهٔ **کهنه‌تر** ⇒ رد می‌شود، کدِ ناصفر، و هیچ چیزی عوض نمی‌شود
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log") -Wait -PassThru
          if ($p.ExitCode -eq 0) { Fail "نصابِ کهنه‌تر (0.0.1) روی 0.0.2 پذیرفته شد" }
          if ((Get-Content "$dir\ver.txt" -Raw) -ne '0.0.2') { Fail "نصابِ کهنه‌تر فایل‌ها را عوض کرد" }
          if ((Get-ItemPropertyValue -Path $unins -Name DisplayVersion) -ne '0.0.2') { Fail "نصابِ کهنه‌تر ثبتِ نسخه را عوض کرد" }
          "✔ نصابِ کهنه‌تر رد شد (کدِ $($p.ExitCode)) و هیچ چیزی عوض نشد"

          # ۴د) همین نسخه دوباره ⇒ پذیرفته (تعمیر)
          $p = Start-Process -FilePath $newer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "نصبِ دوبارهٔ همان نسخه با کدِ $($p.ExitCode) بیرون آمد" }
          "✔ همان نسخه دوباره روی همان نصب نشست (تعمیر)"

          # ۵) حذفِ بی‌صدا: فایل‌ها می‌روند، پوشهٔ داده دست نمی‌خورد
          $data = Join-Path $env:APPDATA 'PumpYaqobi'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Set-Content -Path "$data\pump.db" -Value 'ledger' -NoNewline
          $p = Start-Process -FilePath $uninsExe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "حذف با کدِ $($p.ExitCode) بیرون آمد" }
          if (Test-Path "$dir\PumpYaqobi.exe") { throw "پس از حذف، فایلِ برنامه ماند" }
          if ((Get-Content "$data\pump.db" -Raw) -ne 'ledger') { throw "حذف به پوشهٔ داده دست زد" }
          if (Test-Path 'HKCU:\Software\PumpYaqobi') { throw "کلیدِ Arch پس از حذف ماند" }
          "✔ حذفِ بی‌صدا فایل‌ها را برد و دفتر را دست نزد"

      # ══ ویزاردِ واقعی، با پنجره (۱۴۰۵/۰۷/۱۵) ═══════════════════════════════
      # صاحب ریپو: «نصاب ارور داد و نصب نشد، و انتخابِ فولدر نداشت که بگم کجا یا
      # توی کدوم درایو». همهٔ گام‌های بالا بی‌صدا‌اند و از صفحه‌ها و پیام‌های
      # ویزارد رد نمی‌شوند؛ این گام نصاب را با پنجره باز می‌کند و دکمه‌ها را مثلِ
      # آدم می‌زند (native/installer/test/drive-wizard.ps1).
      - name: ویزاردِ با پنجره — صفحهٔ پوشه، درایوِ نبوده، درایوِ دیگر، به‌روزرسانی
        shell: pwsh
        run: |
          $drive = (Resolve-Path native/installer/test/drive-wizard.ps1).Path
          $old = (Resolve-Path rel\PumpYaqobi-Setup.exe).Path
          $new = (Resolve-Path rel-new\PumpYaqobi-Setup.exe).Path
          $log = Join-Path $env:TEMP 'pyq-ui.log'
          $unins = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8E86F349-343C-4FFB-983E-BBDDC5390081}_is1'
          function Fail($m) { if (Test-Path $log) { Get-Content $log | Select-Object -Last 80 }; throw $m }
          function Show($t, $r) { "── $t"; $r | Format-List | Out-String -Width 400 }
          function Landed($d) { Get-Content (Join-Path $d 'PumpYaqobi.exe') -Raw }
          function AppPath() { Get-ItemPropertyValue -Path $unins -Name 'Inno Setup: App Path' }
          if (Test-Path $unins) { Fail "پیش از ویزارد هنوز نصبی مانده" }

          #  درایوی که روی رانر نیست
          $gone = @('Q','R','S','T','U','V','W','X','Y','Z') | Where-Object { -not (Test-Path "${_}:\") } | Select-Object -First 1
          $dA = 'D:\Pump Test\برنامهٔ پمپ'
          $dB = 'D:\PumpB'
          Remove-Item -Recurse -Force $dA, $dB -ErrorAction SilentlyContinue

          # الف) نصبِ تازه با پنجره: صفحهٔ پوشه هست؛ درایوِ نبوده همان‌جا گفته می‌شود
          #     و صفحه می‌ماند؛ بعد پوشه‌ای با فاصله و نامِ فارسی روی درایوِ D
          $r = & $drive -Setup $old -SetupArgs @('/ARCH=x86') -Dirs @("${gone}:\Pump", $dA) -Log $log
          Show 'الف' $r
          if (-not $r.DirPage) { Fail "صفحهٔ انتخابِ پوشه در نصبِ تازه دیده نشد" }
          if ($r.DirPrefill -notlike '*\Programs\PumpYaqobi') { Fail "پیش‌فرضِ پوشه «$($r.DirPrefill)» است" }
          if (-not ($r.Messages | Where-Object { $_ -match 'درایو' })) { Fail "درایوِ نبوده بی پیام رد شد" }
          if (-not $r.Finished) { Fail "نصبِ تازه به «پایان» نرسید: $($r.Messages -join ' | ')" }
          if ((Landed $dA) -ne 'x86') { Fail "در پوشهٔ انتخابی بارِ ۳۲ ننشست" }
          if ((AppPath) -ne $dA) { Fail "ثبتِ حذف پوشهٔ «$(AppPath)» را می‌گوید" }
          "✔ نصبِ تازه: صفحهٔ پوشه · درایوِ «${gone}:» رد شد و صفحه ماند · نصب در «$dA»"

          # ب) به‌روزرسانی با پنجره روی همان نصب ⇒ صفحهٔ پوشه **دیده می‌شود** و
          #    پیش‌فرضش همان پوشهٔ پیشین است؛ «بعدی» ⇒ همان‌جا، ۶۴بیتی
          $r = & $drive -Setup $new -SetupArgs @('/ARCH=x64') -Log $log
          Show 'ب' $r
          if (-not $r.DirPage) { Fail "روی نصبِ موجود صفحهٔ پوشه رد شد — همان گلایهٔ صاحب ریپو" }
          if ($r.DirPrefill -ne $dA) { Fail "پیش‌فرضِ پوشه روی نصبِ موجود «$($r.DirPrefill)» است، نه «$dA»" }
          if ($r.Messages.Count) { Fail "به‌روزرسانیِ ساده پیام داد: $($r.Messages -join ' | ')" }
          if (-not $r.Finished) { Fail "به‌روزرسانی با پنجره به «پایان» نرسید" }
          if ((Landed $dA) -ne 'x64' -or (Get-Content "$dA\ver.txt" -Raw) -ne '0.0.2') { Fail "به‌روزرسانی در همان پوشه ننشست" }
          "✔ به‌روزرسانی: صفحهٔ پوشه با پیش‌فرضِ «$dA» · ۶۴بیتی · 0.0.2"

          # ج) همان نسخه، پوشهٔ دیگر: یک بار «نه» ⇒ صفحه می‌ماند؛ بعد «بله» ⇒ نصب در پوشهٔ تازه
          $r = & $drive -Setup $new -SetupArgs @('/ARCH=x64') -Dirs @($dB, $dB) -Answer @('No', 'Yes') -Log $log
          Show 'ج' $r
          $asked = @($r.Messages | Where-Object { $_ -match 'الان در این پوشه نصب است' })
          if ($asked.Count -ne 2) { Fail "پرسشِ «پوشهٔ پیشین می‌ماند» $($asked.Count) بار آمد، نه ۲" }
          if (-not $r.Finished) { Fail "نصب در پوشهٔ تازه به «پایان» نرسید" }
          if ((Landed $dB) -ne 'x64') { Fail "در پوشهٔ تازه ننشست" }
          if ((AppPath) -ne $dB) { Fail "ثبتِ حذف پوشهٔ تازه را نمی‌گوید" }
          $u = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '*8E86F349*' })
          if ($u.Count -ne 1) { Fail "با پوشهٔ تازه دو ثبتِ حذف ساخته شد" }
          "✔ پوشهٔ دیگر: «نه» صفحه را نگه داشت، «بله» در «$dB» نصب کرد، یک ثبتِ حذف"

          # د) پوشهٔ مدیر (Program Files): رانر یا مدیر است (هشدار و ادامه) یا نیست (رد و ماندن)
          $pf = Join-Path $env:ProgramFiles 'PumpUiCheck'
          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $r = & $drive -Setup $new -SetupArgs @('/ARCH=x64') -Dirs @($pf, $dB) -Log $log
          Show 'د' $r
          if (-not ($r.Messages | Where-Object { $_ -match 'اجازهٔ مدیر' })) { Fail "پوشهٔ Program Files بی پیام گذشت" }
          if (-not $r.Finished) { Fail "پس از پوشهٔ مدیر نصب به «پایان» نرسید" }
          "✔ پوشهٔ مدیر گفته شد (رانرِ مدیر: $admin)"

          $uninsExe = (Get-ItemPropertyValue -Path $unins -Name UninstallString) -replace '"',''
          Start-Process -FilePath $uninsExe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait
          Remove-Item -Recurse -Force $dA, $dB, $pf -ErrorAction SilentlyContinue
          if (Test-Path $unins) { Fail "حذفِ پایانی انجام نشد" }

      # ══ نصابِ منتشرشده، با پنجره، و باز کردنِ خودِ برنامه ═════════════════════
      # همان فایلی که مشتری می‌گیرد (آخرین انتشار) — با بارِ واقعی، نه ساختگی —
      # هر دو معماری، و بعد برنامهٔ نصب‌شده باز می‌شود و باید باز بماند. «ارور
      # داد» ممکن است مالِ خودِ برنامه پس از نصب باشد؛ این گام همان را می‌بیند.
      # ⚠️ نتیجه گزارش می‌شود ولی جلوی مرج را نمی‌گیرد: رانر میزِ کارِ واقعی ندارد
      # و بسته نبودنِ پنجره آن‌جا همیشه مالِ برنامه نیست.
      - name: نصابِ منتشرشده با پنجره + باز کردنِ برنامه (گزارشی)
        continue-on-error: true
        shell: pwsh
        run: |
          $drive = (Resolve-Path native/installer/test/drive-wizard.ps1).Path
          $setup = Join-Path $env:TEMP 'PumpYaqobi-Setup-real.exe'
          Invoke-WebRequest -Uri 'https://github.com/vil3ntec-it/pump-staion-yaqobi/releases/latest/download/PumpYaqobi-Setup.exe' -OutFile $setup
          "نصابِ منتشرشده: {0:N1} مگابایت" -f ((Get-Item $setup).Length/1MB)
          $data = Join-Path $env:APPDATA 'PumpYaqobi'
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue     # دفترِ ساختگیِ گام‌های قبل
          $log = Join-Path $env:TEMP 'pyq-real.log'
          $dir = 'D:\PumpReal'
          $bad = @()
          foreach ($arch in @('x64', 'x86')) {
            #  ⚠️ نصابِ ۳.۱.۲۰۲ و پیش از آن اولِ کار پنجرهٔ انگلیسیِ «Select Setup Install
            #  Mode» داشت (همین سنجه دیدش) — /CURRENTUSER همان «فقط برای من» است.
            $r = & $drive -Setup $setup -SetupArgs @("/ARCH=$arch", '/CURRENTUSER') -Dirs @($dir) -Log $log -TimeoutSec 600
            "── $arch"; $r | Format-List | Out-String -Width 400
            if (-not $r.Finished) { $bad += "${arch}: نصب به «پایان» نرسید — $($r.Messages -join ' | ')"; if (Test-Path $log) { Get-Content $log | Select-Object -Last 60 }; continue }
            $exe = Join-Path $dir 'PumpYaqobi.exe'
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 30
            if ($p.HasExited) { $bad += "${arch}: برنامه پس از باز شدن بسته شد (کد $($p.ExitCode))" }
            else { "✔ ${arch}: برنامه ۳۰ ثانیه باز ماند"; Stop-Process -Id $p.Id -Force }
            $crash = Join-Path $data 'crash.log'
            if (Test-Path $crash) { "── crash.log ($arch)"; Get-Content $crash -Tail 60; Remove-Item $crash }
          }
          $unins = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8E86F349-343C-4FFB-983E-BBDDC5390081}_is1'
          if (Test-Path $unins) {
            $u = (Get-ItemPropertyValue -Path $unins -Name UninstallString) -replace '"',''
            Start-Process -FilePath $u -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait
          }
          if ($bad.Count) { $bad; throw 'نصابِ منتشرشده ایراد داشت' }
          "✔ نصابِ منتشرشده: هر دو معماری نصب شدند و برنامه باز ماند"
