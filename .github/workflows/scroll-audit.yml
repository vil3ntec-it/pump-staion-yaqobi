name: سنجشِ اسکرولِ بخش‌ها

# ══ چرا ═════════════════════════════════════════════════════════════════════
# گزارشِ صاحب ریپو: «جز جدول‌ها دیگر هیچ چیزی اسکرول نمی‌شود».
#
# این ورک‌فلو به‌جای حدس زدن، پنجرهٔ واقعیِ برنامه را در کوچک‌ترین اندازهٔ
# مجاز (۱۰۰۰×۶۴۰) بی‌نمایشگر می‌سازد و بخش‌به‌بخش می‌سنجد: محتوا از پنجره
# بلندتر است؟ و اگر هست، راهی برای رسیدن به تهش وجود دارد؟
#
# اگر بخشی سرریز کند و اسکرول نداشته باشد، با کدِ ناصفر بیرون می‌آید.
on:
  workflow_dispatch:
  # روی برنچ هم اجرا شود: تا وقتی روی ‎main‎ ننشسته، «اجرای دستی» در دسترس
  # نیست و گزارش هرگز دیده نمی‌شود.
  push:
    branches-ignore:
      - main
    paths:
      - 'native/**'
      - '.github/workflows/scroll-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: سنجشِ اسکرول
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- scroll

      # ══ سنجشِ صفحهٔ حسابِ قرض‌دار ════════════════════════════════════════
      # گزارشِ صاحب ریپو: «حساب فرعی کار نمی‌کند» و «جدولِ جدید درست نمی‌شود».
      # هیچ آزمونی این‌ها را نمی‌گرفت، چون هر دو پشتِ یک پنجرهٔ گفت‌وگو بودند و
      # چون «بیرونِ لبهٔ پنجره افتادن» فقط روی پنجرهٔ واقعی دیده می‌شود.
      - name: سنجشِ صفحهٔ حسابِ قرض‌دار
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- person

      # ══ عکسِ ۱۴۰۵/۰۷/۲۲ با پنجرهٔ واقعی (X11)، نه آوالونیای بی‌سر ══════════
      # ماهِ پیش با ردیف‌های خالی، ماهِ جاری با نوشته‌های بلند، پهنای دستیِ ستون؛
      # هر خانه: کادرِ نوشته وسطِ خانه و ‎TextLayout‎ی که کشیده می‌شود با پهنای خودش.
      - name: نوشتهٔ خانه‌ها پس از عوض کردنِ ماه — پنجرهٔ واقعی ۱۰۰٪ و ۱۵۰٪
        if: ${{ !cancelled() }}
        working-directory: native
        run: |
          set -e
          dotnet build PumpYaqobi.UiTests -c Release -v q
          for sc in 1 1.5; do
            for drag in 0 1; do
              echo "════ مقیاس $sc · پهنای دستی $drag ════"
              RS_DRAG=$drag AVALONIA_GLOBAL_SCALE_FACTOR=$sc xvfb-run -a -s "-screen 0 2400x1500x24" \
                dotnet run --no-build --project PumpYaqobi.UiTests -c Release -- realshift
            done
          done

      # رفتارهای فهرستِ ۱۴۰۵/۰۶/۲۵ که فقط از روی کد نوشته شده بودند و صاحب ریپو
      # گفت «با تست بگو، نه با حدس»: رسیدِ سربرگ در اولین ردیفِ خالی، رها شدنِ
      # فوکوس، Ctrl+Delete، تاریخچهٔ بخش، Tab/Enter در پیشنهاد، ماشین‌حساب.
      - name: سنجشِ رفتاریِ اصلاح‌ها
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- verify

      # ══ «برنامه را بستم، دوباره آمدم — ورق‌ها نبودند» ═══════════════════════
      # گزارشِ صاحب ریپو (۱۴۰۵/۰۷/۱۲). چهار حالت، هر کدام در **دو فرآیندِ جدا**
      # (نوشتن، بعد باز کردنِ دوباره): بستنِ عادی، رفتنِ برق وسطِ تایپ، عوض
      # شدنِ ماه، و پهنای ستونِ هر حساب جدا — به‌علاوهٔ هم‌ترازیِ نوارِ «جمله».
      - name: سنجشِ ماندگاری پس از بستن و باز کردن
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- persist

      # ══ خودِ ورق‌های چاپی — رنگی و سیاه‌وسفید ═════════════════════════════
      # دکمهٔ PDFِ پنج بخشِ واقعی زده و ورق‌ها تصویر می‌شوند؛ شکستِ ساخت سرخ
      # می‌کند. عکس‌ها برای چشم در پوشهٔ خروجی می‌مانند.
      - name: سنجشِ ورق‌های چاپی
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- printpages ${{ runner.temp }}/printpages

      # ══ چهار بندِ فهرستِ یازده‌تایی که تا امروز فقط «درست شد» گفته شده بودند ══
      # ماه عوض شد ⇒ سرستون‌ها سرِ جایشان (دو تم)، فرمِ خرید درجا و قفل، و
      # جدولِ پایه‌های ورق روی پنجرهٔ ۱۰۲۴ پیکسلی بی نوارِ افقی و بی عددِ بریده.
      - name: سنجشِ فهرستِ یازده‌تایی
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- audit11 ${{ runner.temp }}/audit11

      # ══ حساب‌های دیر رسیده · هیچ جدولی کاربر را به چپ و راست نبرد (۱۴۰۵/۰۷/۱۶) ══
      # ردیفِ ماهِ گذشته از بیرون ⇒ بازگشت به مصارف/گاوصندوق/صرافی ⇒ ماه در کشویی؛
      # و هر جدولِ هر بخش و حساب در دو اندازهٔ پنجره داخلِ قابِ خودش.
      - name: ماهِ دیر رسیده و دیوارِ جدول‌ها
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- latemonths

      - name: ماه‌های قبل و وسط‌چینیِ نوشته‌ها
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- oldmonths

      # ══ «توی ورق نوشتن کند است، حرف‌ها پاک یا نصفه می‌شوند» (۱۴۰۵/۰۷/۱۹) ══
      # حرف‌به‌حرف با فاصلهٔ واقعی روی دادهٔ پنج‌ساله: مکثِ نخِ رابط، و کادر دقیقاً همان که زده شد.
      - name: نوشتن در ورق، حرف‌به‌حرف
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- waraqtype

      # ══ «12960 نباید 12906 یا 2960 شود، 60.14 همان 60.14» — همهٔ برنامه (۱۴۰۵/۰۷/۱۹) ══
      # هر خانهٔ هر جدول و هر کادرِ تایپِ هر بخش، حرف‌به‌حرف با کلیدِ واقعی؛ و همان با
      # تایپِ مستقیمِ اکسل‌گونه (بی F2) و تند، که حرفِ اول را می‌خورد.
      - name: هر کادر و هر خانه همان که زده شد
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- typeall
      - name: هر کادر و هر خانه — تایپِ مستقیم و تند
        working-directory: native
        env:
          TA_DIRECT: '1'
          TA_FAST: '1'
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- typeall

      # ══ گزارشِ پارچه ویرایشی، و فاکتور از خودِ حسابِ قرض‌دار (۱۴۰۵/۰۷/۱۹) ══
      - name: ویرایشِ گزارشِ پارچه و تاییدِ فاکتور از حساب
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- reportedit

      # ══ هر شکلِ نوشته (فاصلهٔ پایانی، تب، نویسهٔ جهت‌نما، ایموجی، تاریخ) وسطِ کادرش،
      # با پیکسلِ واقعی در ۱۰۰/۱۲۵/۱۵۰٪ (۱۴۰۵/۰۷/۱۹) ══
      - name: آزمایشگاهِ وسط‌چینی
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- centerlab

      # ══ رساندن به ماهِ گذشته + هر بخش در همان ماه (۱۴۰۵/۰۷/۱۸، دوم) ═══════
      # هر نوشتهٔ وسط‌چینِ برنامه با پیکسلِ واقعی؛ پارچهٔ خالی‌شده؛ Ctrl+Tab بی فوکوس.
      - name: رساندن به ماهِ گذشته و ترازِ همهٔ نوشته‌ها
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- oldpost

      # ══ کشیدنِ خطِ ستون با ماوسِ واقعی (۱۴۰۵/۰۷/۱۷) ═════════════════════
      # وسطِ کشیدن نه ستونی از قاب بیرون می‌زند نه جای خالی می‌ماند.
      - name: کشیدنِ ستون داخلِ قابِ جدول
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- coldrag

      # ══ فرمِ «ثبت خرید»ِ مخزن (۱۴۰۵/۰۷/۱۶) ═══════════════════════════════
      # کلیدهای جهت‌دار از فرم بیرون نمی‌روند، یادداشت کامل، قیمت و نرخ
      # اختیاری، و ✏️ برای ویرایش پس از ثبت — با حسابِ شرکت.
      - name: سنجشِ فرمِ خرید
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- buyform ${{ runner.temp }}/buyform

      # ══ ورق با عکسِ صاحب ریپو (۱۴۰۵/۰۷/۱۲) ════════════════════════════════
      # دیوارِ ستون‌ها (پهنای ذخیره‌شدهٔ بزرگ‌تر از قاب هم)، قرائتِ پمپ از پارچه
      # (بی تاریخ و هشدار، تیلِ قفل، خطِ خودِ خانهٔ سرخ با پیامِ کوتاه)، جملهٔ
      # شیفت در PDF و ورقِ تیزِ پیش‌نمایش با زوم.
      - name: سنجشِ ورق — دیوار، قرائتِ پمپ، PDF و کیفیتِ چاپ
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- waraqfit ${{ runner.temp }}/waraqfit

      # ══ تاریخچه‌ها (۱۴۰۵/۰۷/۱۲) ═══════════════════════════════════════════
      # ستون‌های هر بخش (پارچه، ورق، صرافی، شرکت) و اسکرولِ تاریخچهٔ بلند: سرستون
      # همراه نمی‌آید، نوارِ سفید نیست و ردیف‌ها پشتِ سرِ هم‌اند.
      - name: سنجشِ تاریخچه‌ها
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- historyfit ${{ runner.temp }}/historyfit

      # ══ دورِ سیزدهم (۱۴۰۵/۰۷/۱۳) ═════════════════════════════════════════
      # وزنِ خرید به کیلو، آرشیوِ شرکت با هر دو تیل و PDF، جست‌وجوی خریدِ
      # درون‌خطی، جدول بی جای خالی در سه پهنای پنجره، و صافیِ تاریخچهٔ پارچه.
      - name: سنجشِ دورِ سیزدهم
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- round13 ${{ runner.temp }}/round13

      # ══ دورِ چهاردهم: نوارِ یک‌خطی · فرمِ رسید و چکنه · فهرستِ هشدارها ═════
      - name: سنجشِ دورِ چهاردهم
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- round14 ${{ runner.temp }}/round14

      # ══ دورِ پانزدهم (۱۴۰۵/۰۷/۱۵) ═════════════════════════════════════════
      # «در دارک مود نوشته‌ها می‌روند سمتِ چپ»: یک تعویضِ تم نباید هیچ نوشتهٔ
      # چیده‌شده‌ای را چپ‌چین بکشد (مقیاسِ ۱۲۵٪ِ ویندوز، همهٔ بخش‌ها، هر دو تم).
      - name: سنجشِ نوشتهٔ چپ‌چین پس از تم
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- layoutcycle ${{ runner.temp }}/layoutcycle

      # سربرگ (تمِ رادیویی، تاریخ با نامِ ماه، ساعتِ خودِ برنامه) · ترتیبِ
      # بخش‌ها · سربرگِ جمع‌وجور و جدولِ رسیدِ پارچه که ناپدید نمی‌شود.
      - name: سنجشِ دورِ پانزدهم
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- round15 ${{ runner.temp }}/round15

      # دورِ شانزدهم (۱۴۰۵/۰۷/۱۶): تاریخِ نمایشی بی هشدار، فاکتورِ جمع‌وجور،
      # توضیحِ بخش بغلِ کادرها، کلیدِ نوارِ عددهای بالا و پرسشِ به‌روزرسانی.
      - name: سنجشِ دورِ شانزدهم
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- round16 ${{ runner.temp }}/round16

      # کشوییِ «☰ کارها» (۱۴۰۵/۰۷/۱۶): تاریخچه، ماهِ جدید، PDF و زیربخش‌های
      # هفت بخش — واقعاً باز و زده می‌شود؛ و «تاریخچهٔ پایه‌ها»ی پارچه دیگر نیست.
      - name: کشوییِ کارهای بخش‌ها
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- moremenu

      # شورا، ث۲/ث۴/ث۶: نوارِ میانبرها و «💡»، کادرِ چراغ، و حالتِ ساده —
      # با کلیک و پنجرهٔ واقعی.
      - name: تجربهٔ کاربر (شورا، ث)
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- ux ${{ runner.temp }}/ux

      # شورا، ث۱: پمپ‌دارِ تازه با فقط چک‌لیستِ «شروعِ سریع» تا نخستین ورق —
      # «👉 نشانم بده»، کادرِ برجسته، کلیک و کلیدِ واقعی؛ و برگهٔ PDFِ یک‌صفحه‌ای.
      - name: شروعِ سریع (شورا، ث۱)
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- quickstart ${{ runner.temp }}/quickstart

      # «توی حسابِ قرض‌دار نمی‌ره» (۱۴۰۵/۰۷/۱۶): هر دکمهٔ دیدنیِ کلِ برنامه که
      # اتصالِ فرمانش خطا داد و فرمانش خالی ماند ⇒ سرخ.
      - name: سنجشِ دکمه‌های مرده
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- bindsweep

      # «داخلِ ورق اسکرول پرپر می‌شود»: چرخِ واقعی روی هر سه جدول، یک فریم پس
      # از هر گام؛ نه پرش، نه برگشت، نه پهنای لرزان، نه نوشتهٔ کج.
      - name: سنجشِ لغزیدنِ ورق
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- waraqscroll ${{ runner.temp }}/waraqscroll

      # ══ مفاد/ضرر: کشوی ماه و سال و کادرهای برابر · مخزن: عنوانِ وسط ═════════
      # گزارشِ صاحب ریپو (۱۴۰۵/۰۷/۱۳) با عکس. عددِ هر دوره از روی دادهٔ خودِ
      # سنجه حساب می‌شود، و پهنا/قد/لبهٔ هر کادر با پنجرهٔ واقعی سنجیده می‌شود.
      - name: سنجشِ مفاد/ضرر و مخزن
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- plstore ${{ runner.temp }}/plstore

      # ══ چت‌روم: سه ستون، تمام‌صفحه، گروهِ کارکنان، سطلِ ۱۵+۱۵ روزه ══════════
      # خواستهٔ صاحب ریپو (۱۴۰۵/۰۷/۱۳). پنجرهٔ واقعی، دفترِ چتِ واقعی روی دیسک
      # (بی هیچ سرور): فهرست · گفت‌وگو · کارتِ طرف، و پیامِ کهنه در سطل.
      - name: سنجشِ چت‌روم
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- chatroom ${{ runner.temp }}/chatroom

      # ══ Shift+عدد، Ctrl+Z و Ctrl+Y — با کلید و کلیکِ واقعی ══════════════════
      # گزارشِ صاحب ریپو (۱۴۰۵/۰۷/۱۲): «شیفت با عدد حذف نمی‌کند… کنترول زد و
      # وای کار نمی‌کنند.» ردیفِ خالی بی‌پرسش، ردیفِ پر با پرسش؛ برگشت و
      # دوباره برای خانه، ردیف و کلِ حساب؛ تکملهٔ کم‌رنگ؛ «دیدم» داخلِ کادر.
      - name: سنجشِ حذف و برگشت
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- undokeys

      # ══ ۱۴۰۵/۰۷/۱۷: ورق ⇄ پارچه ⇄ تاریخچه، «/هارون»، و کلیدهای پارچه و ورق ══
      - name: سنجشِ ویرایشِ دوطرفه و کلیدهای پارچه/ورق
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- keys17

      # ══ ۱۴۰۵/۰۷/۱۹: عدد با کاما و تاریخ با «/» همان لحظهٔ تایپ · کپسولِ «نوع» با Enter/Tab ══
      - name: سنجشِ قالبِ زندهٔ عدد و تاریخ و کپسول‌های جدول
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- liveformat

      - name: سنجشِ نمودارهای داشبورد (جهت و دو تبِ روند)
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- liveformat shots "$RUNNER_TEMP/dash-shots"

      # ══ حسابِ فرعی · «جدول جدید» پس از «نه» · جستجوی خرید · ثقلت ══
      - name: سنجشِ حسابِ فرعی، کشوییِ کارها، جستجوی خرید و فرمِ خرید
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- owner17b

      # ══ رسیدِ سربرگِ قرض‌دار: ردیف ساخته شود و به حسابِ دیگر سرایت نکند ══
      - name: سنجشِ رسیدِ سربرگ
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- headrasid

      # ══ بی‌اشتراک = فقط‌خواندنی؛ پولیِ تمام‌شده یک هفته فرصت (۱۴۰۵/۰۷/۲۰) ══
      - name: سنجشِ قفلِ فقط‌خواندنی
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- readonly

      # ══ تیل امانت در حالِ ساخت (رمزِ توسعه) و دوربین‌ها پنهان ══
      - name: سنجشِ بخش‌های بسته
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- sectiongate

      # ══ ساعتِ ویندوز وسطِ کار جلو و عقب: تاریخ، ماه، ردیفِ تازه و اشتراک تکان نخورند ══
      # (۱۴۰۵/۰۷/۱۵ — «وقتی تاریخ رو عوض می‌کنم تمامِ سیستم به هم می‌خوره»)
      - name: سنجشِ جابه‌جاییِ ساعتِ ویندوز
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- clockjump

      # ══ «فایلِ کاملِ برنامه»: ساختن ⇒ خرابی ⇒ آوردن ⇒ شمارِ هر جدول، تم و نوار ══
      # و «فرستادن به سرور» و «نصب از فایل» با دکمه‌های واقعیِ صفحه (۱۴۰۵/۰۷/۱۵).
      - name: سنجشِ فایلِ کاملِ برنامه
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- fullbackup

      # ══ ورود، کدِ ایمیلی، بند شدن و همگام‌سازی — با ابرِ ساختگیِ درون‌فرآیندی ══
      # تا ۳.۱.۱۶۴ هر دو روی `main` سرخ بودند و در CI نبودند، پس کسی نمی‌دید.
      # ریشهٔ هر دو خودِ سنجه بود (ابرِ ساختگی مسیرِ ‎device/bind‎ را نداشت؛
      # ‎syncui‎ کدِ درست را می‌چسباند و ارسالِ خودکار زودتر وارد می‌شد).
      # ⛔ هیچ درخواستی به سرورِ واقعی نمی‌رود (‎CloudLink.TestTransport‎).
      - name: سنجشِ ورود و اشتراک (ابرِ ساختگی)
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- cloudlogin
      - name: سنجشِ همگام‌سازی و کدِ ایمیلی
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- syncui

      # ══ پنجره‌های گفت‌وگو ═════════════════════════════════════════════════
      # گزارشِ صاحب ریپو: «افزودن شخص / ورق / حساب فرعی / جدول جدید / آرشیو
      # هیچ‌کدام کار نمی‌کنند و پیامِ Object reference not set می‌آید.»
      # هیچ سنجشی این را نمی‌گرفت چون سنجشِ ‎person‎ با قلاب از خودِ پنجره رد
      # می‌شد. این‌جا پنجره‌های واقعی ساخته و نشان داده می‌شوند.
      - name: سنجشِ پنجره‌های گفت‌وگو
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- dialogs

      # ══ سنجشِ پارچه‌ها و ورق‌ها ══════════════════════════════════════════
      # دو جدولِ هم‌شکلِ ورق، خانه‌های پشتِ همِ پارچه، تمام‌عرض بودنِ بخش‌ها، و
      # منطقِ «پارچهٔ جدید» (چند پایه در یک روز).
      - name: سنجشِ پارچه‌ها و ورق‌ها
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- parcha

      # ══ سرِ جدول، زیرِ جدول، و کلیدهای چپ و راست ═════════════════════════
      # سه گزارشِ صاحب ریپو که هیچ‌کدام از روی کد دیده نمی‌شدند و فقط با
      # اندازه‌گیریِ پنجرهٔ واقعی درمی‌آیند:
      #
      #   «سرِ جدول‌ها هنوز وسط نیستن جمله‌هاشون» — نوشتهٔ سرستون ۱۶ پیکسل
      #   کنار بود، چون قالبِ پیش‌فرضِ ‎DataGridColumnHeader‎ یک ستونِ ۳۲تایی
      #   برای نشانهٔ مرتب‌سازی کنار می‌گذارد.
      #
      #   «زیرِ جدول‌ها پایینِ همان کادرِ موردِ نظرشان نیستن» — نوارِ لغزشِ
      #   عمودیِ جدول ۱۷ پیکسل جابه‌جایشان می‌کرد.
      #
      #   «کلیدهای چپ و راست باگ دارن … اگه بخاد چپ بره اتومات میره رایت» —
      #   در قابِ راست‌به‌چپ، آوالونیا کُرسر را با جهتِ **کادر** می‌برد نه
      #   جهتِ نوشته، پس روی عددهای لاتین وارونه می‌شد.
      - name: سنجشِ سر و تهِ جدول‌ها
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- chrome

      - name: سنجشِ کلیدهای چپ و راست
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- keys

      # ══ کادرها دیده می‌شوند؟ فلشِ کشویی جا می‌گیرد؟ ══════════════════════
      # «کادرها با بک‌گراند تفاوت رنگ ندارن … هیچ‌کدوم دیده نمی‌شد، حتی خودِ
      # جدول‌ها» و «اون علامتِ ⌄ فقط جا اضافه گرفته».
      - name: سنجشِ کادرها و کشویی‌ها
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- look

      # ══ خانهٔ جدول مثلِ اکسل ══════════════════════════════════════════════
      # «محضِ این‌که می‌روم خودش انتخاب شده است و اگر بک‌اسپیس بزنم پاک می‌شود،
      # یا اگر بزنم روی یک عدد آن تغییر می‌کند … باید سه بار بزنم رویش» و
      # «توی کادر یک کادرِ دیگر آمده … یک کادرِ سرخ که تویش حروف نوشته».
      # و: اندازهٔ ستون بی سقف و بی کف، با لغزشِ افقی.
      - name: سنجشِ خانهٔ جدول
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- cells

      # ══ پردهٔ لودینگِ آغاز ═══════════════════════════════════════════════
      # «موقعِ تازه باز کردنِ اپ باید یک لودینگ داشته باشه تا همهٔ بخش‌ها و
      # برنامه رو رندر کنه؛ بعدش بازگشت به صفحهٔ اصلی نباید تأخیری داشته باشه.»
      # پرده می‌آید و می‌رود، همهٔ بخش‌ها گرم می‌شوند، و بازِ اول دیگر سرد نیست.
      - name: سنجشِ پردهٔ لودینگ
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- warm

      # ══ ورقِ پُر زود باز شود ═══════════════════════════════════════════════
      # «ورق جوری باشه که سقف پایینی نداشته باشه و تا ۱۰۰ تا کادر رو به راحتی
      # باز کنه.» باز کردن و بازگشت هر دو زیرِ مرز می‌مانند.
      - name: سنجشِ ورقِ پُر
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- waraqperf

      # ══ «بازگشت به صفحهٔ اصلی کند است» ══════════════════════════════════
      # با دفترِ چندساله، نه با دانهٔ ده‌ردیفی: داشبورد با هر بار باز شدن
      # کلِ دفترها را می‌خواند و همین سال‌ها پنهان مانده بود.
      - name: سنجشِ بازگشت به صفحهٔ اصلی
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- dashperf

  # ══ وسط‌چینی روی خودِ ویندوز (۱۴۰۵/۰۷/۱۹) ═════════════════════════════════
  # گزارشِ صاحب ریپو: «به محضِ این‌که بیام ماهِ قبل همه‌چی می‌ره چپ» — در حالی که
  # همین سنجه‌ها روی لینوکس سبز بودند. قلم‌ها و شکل‌دهنده روی ویندوز فرق دارند،
  # پس همان سنجه‌های پیکسلی این‌جا هم می‌دوند.
  align-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: آزمایشگاهِ وسط‌چینی (ویندوز)
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- centerlab ${{ runner.temp }}/clab
      - name: ماه‌های قبل (ویندوز)
        if: ${{ !cancelled() }}
        working-directory: native
        env:
          OM_MANY: '1'
          OM_DEBUG: '1'
          OM_SHOTS: ${{ runner.temp }}/om
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- oldmonths
      - name: ماه‌های قبل ۱۲۵٪ (ویندوز)
        if: ${{ !cancelled() }}
        working-directory: native
        env:
          OM_MANY: '1'
          OM_DEBUG: '1'
          OM_SCALE: '1.25'
          OM_W: '1366'
          OM_H: '768'
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- oldmonths
      - name: نوشتن در ورق (ویندوز)
        if: ${{ !cancelled() }}
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- waraqtype
      - name: هر کادر و هر خانه — تایپِ مستقیم و تند (ویندوز)
        if: ${{ !cancelled() }}
        working-directory: native
        env:
          TA_DIRECT: '1'
          TA_FAST: '1'
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- typeall
      - name: رساندن به ماهِ گذشته (ویندوز)
        if: ${{ !cancelled() }}
        working-directory: native
        env:
          OP_DEBUG: '1'
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- oldpost ${{ runner.temp }}/oldpost
      # ══ عکسِ ۱۴۰۵/۰۷/۲۲: «سنبله» با ردیف‌های خالی (فقط تاریخ و «0») در مصارف و گاوصندوق ══
      # دفترِ تهی، مثلِ کامپیوترِ صاحب ریپو؛ رفت‌وبرگشتِ ماه و سال؛ جوهرِ هر خانه با پیکسلِ ویندوز.
      - name: ردیف‌های خالیِ ماهِ پیش — ۱۰۰٪ و ۱۲۵٪ و ۱۵۰٪ (ویندوز)
        if: ${{ !cancelled() }}
        working-directory: native
        shell: bash
        env:
          MS_EMPTY: '1'
        run: |
          set -e
          for sc in 1.0 1.25 1.5; do
            for s in blank-expenses blank-safe; do
              echo "════ $s · $sc ════"
              MS_SCALE=$sc MS_SHOTS="${{ runner.temp }}/blank-$sc" dotnet run --project PumpYaqobi.UiTests -c Release -- monthshift all $s
            done
          done
      - name: مصارف و گاوصندوق با دفترِ دوساله — ۱۲۵٪ (ویندوز)
        if: ${{ !cancelled() }}
        working-directory: native
        shell: bash
        env:
          MS_SCALE: '1.25'
          MS_WIDTH: '1366'
          MS_HEIGHT: '768'
          MS_SHOTS: ${{ runner.temp }}/ms125
        run: |
          set -e
          for s in expenses safe; do dotnet run --project PumpYaqobi.UiTests -c Release -- monthshift all $s; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: align-windows
          path: |
            ${{ runner.temp }}/clab
            ${{ runner.temp }}/om
            ${{ runner.temp }}/oldpost
            ${{ runner.temp }}/blank-*
            ${{ runner.temp }}/ms125
          if-no-files-found: ignore
