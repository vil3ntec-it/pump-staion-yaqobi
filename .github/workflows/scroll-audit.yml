name: سنجشِ اسکرولِ بخش‌ها

# ══ چرا ═════════════════════════════════════════════════════════════════════
# گزارشِ صاحب ریپو: «جز جدول‌ها دیگر هیچ چیزی اسکرول نمی‌شود».
#
# این ورک‌فلو به‌جای حدس زدن، پنجرهٔ واقعیِ برنامه را در کوچک‌ترین اندازهٔ
# مجاز (۱۰۰۰×۶۴۰) بی‌نمایشگر می‌سازد و بخش‌به‌بخش می‌سنجد: محتوا از پنجره
# بلندتر است؟ و اگر هست، راهی برای رسیدن به تهش وجود دارد؟
#
# اگر بخشی سرریز کند و اسکرول نداشته باشد، با کدِ ناصفر بیرون می‌آید.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: سنجش
        working-directory: native
        run: dotnet run --project PumpYaqobi.UiTests -c Release -- scroll
