name: آزمونِ اپِ کارمندان

# ربات و قفلِ رمزِ اپِ کارمندان (‎kar/‎) هیچ ربطی به دات‌نت ندارند و نباید
# منتظرِ ساختِ نیتیو بمانند — یک ورک‌فلوی سبکِ چندثانیه‌ای، فقط Node.
#
# ⚠️ مهم‌ترین چیزی که این‌جا قفل می‌شود، سازگاریِ **قفلِ رمز** است: اپ همان
# رمزِ برنامهٔ کامپیوتر را می‌پرسد و با PBKDF2ِ خودِ مرورگر می‌سنجد. اگر شکلِ
# هش یا کدگذاریِ رمز یک سرِ سوزن فرق کند، کارمند رمزِ درستش را می‌زند و اپ باز
# نمی‌شود — و هیچ‌کس نمی‌فهمد چرا.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'kar/**'
      - 'view/**'
      - 'tools/check-kar-bot.mjs'
      - 'tools/check-kar-ui.mjs'
      - 'tools/check-view.mjs'
      - 'tools/check-view-buttons.mjs'
      - 'tools/check-kar-print.mjs'
      - 'tools/check-kar-pumps.mjs'
      - '.github/workflows/test-kar.yml'
  push:
    branches-ignore:
      - main
    paths:
      - 'kar/**'
      - 'view/**'
      - 'tools/check-kar-bot.mjs'
      - 'tools/check-kar-ui.mjs'
      - 'tools/check-view.mjs'
      - 'tools/check-view-buttons.mjs'
      - 'tools/check-kar-print.mjs'
      - 'tools/check-kar-pumps.mjs'
      - '.github/workflows/test-kar.yml'

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ربات، ماه‌ها و قفلِ رمز
        run: node tools/check-kar-bot.mjs
      # صفحهٔ کیو‌آرِ مشتری (‎view/‎) — تا امروز هیچ CIای نمی‌دواندش
      - name: صفحهٔ کیو‌آرِ مشتری
        run: node tools/check-view.mjs
      # همان اپ در کرومیومِ واقعی: کد، قفل، دو در، فیلترها و «فقط دیدن»
      - name: اپِ گوشی در مرورگر
        run: |
          npm i -g playwright@1
          node "$(npm root -g)/playwright/cli.js" install --with-deps chromium
          node tools/check-kar-ui.mjs
      # هر دکمهٔ صفحهٔ کیو‌آر با کلیکِ واقعی — چت، پیوست، ضبطِ صدا، فیلترها، چاپ
      - name: دکمه‌های صفحهٔ کیو‌آر
        run: node tools/check-view-buttons.mjs
      - name: PDF و چاپِ اپِ گوشی — همان ورقِ برنامهٔ کامپیوتر
        run: node tools/check-kar-print.mjs
      - name: پمپ‌هایم — یک گوشی، چند پمپ، هیچ قاطی (شورا چ۴)
        run: node tools/check-kar-pumps.mjs
