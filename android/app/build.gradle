plugins { id 'com.android.application' }

// نسخهٔ برنامه دستی تنظیم نمی‌شود: ورک‌فلوی ساخت، همان APP_VERSION داخلِ
// index.html را با ‎-PappVersionName=…‎ می‌دهد. اگر داده نشود، از خودِ فایل خوانده
// می‌شود تا ساختِ محلی هم همیشه با نسخهٔ واقعیِ برنامه یکی باشد.
def readAppVersion = {
  if (project.hasProperty('appVersionName')) return project.appVersionName
  try {
    def f = new File(rootDir, '../index.html')
    if (f.exists()) {
      def m = (f.getText('UTF-8') =~ /const\s+APP_VERSION\s*=\s*['"]([0-9.]+)['"]/)
      if (m) return m[0][1]
    }
  } catch (ignored) { }
  return '0.0.1'
}
def appVersionNameValue = readAppVersion()
def appVersionCodeValue = {
  def p = appVersionNameValue.tokenize('.').collect { (it.toInteger() ?: 0) }
  while (p.size() < 3) p << 0
  return p[0] * 1000000 + p[1] * 10000 + p[2]
}()

// ══ یک پروژه، دو فایلِ نصب ═══════════════════════════════════════════════════
//
// خواستهٔ صاحب ریپو: «ای‌پی‌کی‌شو بده برای اندروید و کارمندان.»
//
// اپِ کارمندان (‎kar/‎) همان پوستهٔ وب‌ویو را می‌خواهد که اپِ اصلی دارد، پس
// پروژهٔ گریدل یکی می‌ماند و فقط سه چیز از بیرون داده می‌شود: شناسهٔ بسته، نامِ
// روی صفحه، و این‌که چه چیزی داخلِ ‎assets/www‎ کپی شده.
//
// ⚠️ پیش‌فرض‌ها **دقیقاً همان‌های قبل‌اند**، پس ساختِ اپِ اصلی ذره‌ای عوض
// نمی‌شود. دو شناسهٔ جدا یعنی هر دو با هم روی یک گوشی نصب می‌شوند و هیچ‌کدام
// آن یکی را پاک نمی‌کند.
def appIdValue = project.hasProperty('appId') ? project.appId : 'top.yaqobipump.app'
def appLabelValue = project.hasProperty('appLabel') ? project.appLabel : 'پمپ یعقوبی'

android {
  namespace 'top.yaqobipump.app'
  compileSdk 34

  defaultConfig {
    applicationId appIdValue
    minSdk 23
    targetSdk 34
    versionCode appVersionCodeValue
    versionName appVersionNameValue
    manifestPlaceholders = [appLabel: appLabelValue]
  }

  buildTypes {
    release {
      minifyEnabled false
      // امضای دیباگ تا فایل بدونِ کلیدِ اختصاصی هم نصب‌شدنی باشد
      signingConfig signingConfigs.debug
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

// هیچ وابستگیِ بیرونی لازم نیست — فقط WebView خودِ اندروید.
// (androidx/kotlin برداشته شد چون نسخه‌هایشان با هم تضاد داشت و ساخت را می‌شکست)
dependencies { }
