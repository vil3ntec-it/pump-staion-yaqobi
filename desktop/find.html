<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>جست‌وجو در صفحه</title>
<style>
  :root{
    --bg:#151d26; --brd:#293544; --txt:#e8edf3; --muted:#8a97a6; --accent:#3b82f6;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; background:transparent}
  body{
    display:flex; align-items:center; gap:8px;
    font-family:'Vazirmatn',Tahoma,sans-serif; font-size:13px; color:var(--txt);
    background:var(--bg); border:1px solid var(--brd); border-radius:12px;
    padding:0 10px; height:100%;
    box-shadow:0 12px 30px rgba(15,23,42,.35);
    -webkit-app-region:drag; user-select:none;
  }
  input,button{ -webkit-app-region:no-drag; font-family:inherit }
  input{
    flex:1; min-width:0; height:34px; padding:0 10px;
    background:#0e141b; color:var(--txt);
    border:1px solid var(--brd); border-radius:8px; font-size:13px;
  }
  input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(59,130,246,.25) }
  .count{ color:var(--muted); font-size:12px; min-width:58px; text-align:center; font-variant-numeric:tabular-nums }
  button{
    height:30px; min-width:30px; padding:0 8px;
    background:transparent; color:var(--txt);
    border:1px solid var(--brd); border-radius:8px; cursor:pointer; font-size:13px;
    display:inline-flex; align-items:center; justify-content:center;
    transition:background-color 140ms cubic-bezier(.2,.8,.2,1), border-color 140ms;
  }
  button:hover{ background:#1c2733; border-color:var(--accent) }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px }
  svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.9;
       stroke-linecap:round; stroke-linejoin:round }
</style>
</head>
<body>
  <input id="q" type="text" placeholder="جست‌وجو در این صفحه…" autocomplete="off" spellcheck="false">
  <span class="count" id="count"></span>
  <button id="prev" title="قبلی (Shift+Enter)"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
  <button id="next" title="بعدی (Enter)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <button id="close" title="بستن (Esc)"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
<script>
  var q = document.getElementById('q');
  var count = document.getElementById('count');
  var last = '';
  function send(findNext, forward){
    var t = q.value;
    if (!t) { count.textContent = ''; window.pumpFind.stop(); last = ''; return; }
    window.pumpFind.query(t, findNext, forward);
    last = t;
  }
  q.addEventListener('input', function(){ send(false, true); });
  q.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); send(true, !e.shiftKey); }
    else if (e.key === 'Escape'){ e.preventDefault(); window.pumpFind.close(); }
  });
  document.getElementById('next').onclick = function(){ send(true, true); q.focus(); };
  document.getElementById('prev').onclick = function(){ send(true, false); q.focus(); };
  document.getElementById('close').onclick = function(){ window.pumpFind.close(); };
  window.pumpFind.onResult(function(r){
    count.textContent = r.matches ? (r.active + ' از ' + r.matches) : 'یافت نشد';
  });
  window.pumpFind.onFocus(function(){ q.focus(); q.select(); });
  q.focus();
</script>
</body>
</html>
