<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>در حال بارگذاری…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, #16233b 0%, #0b0f17 60%, #070a11 100%);
    color: #e8eef7;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; gap: 14px;
    border: 1px solid rgba(255,179,0,.18);
  }
  .logo {
    width: 96px; height: 96px; border-radius: 24px; object-fit: cover;
    box-shadow: 0 12px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,179,0,.25);
    animation: pop .7s cubic-bezier(.2,.9,.25,1.15);
  }
  .title { font-size: 1.45rem; font-weight: 800; letter-spacing: .5px;
    background: linear-gradient(90deg, #ffd166, #ffb300); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: .8rem; color: #9fb0c7; margin-top: -4px; }

  /* نوارِ پیشرفتِ واقعی — عرضش دقیقاً همان درصدی است که همین حالا انجام شده.
     هیچ انیمیشنِ «همیشه در حال حرکت»ی در کار نیست: اگر بایستد یعنی واقعاً
     همان‌جا کار دارد انجام می‌شود. */
  .bar { width: 300px; height: 7px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #ffb300, #ff8a00);
    transition: width .18s linear; }
  .row { width: 300px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .stage { font-size: .78rem; color: #b8c6da; }
  .pct { font-size: .78rem; color: #ffb300; font-weight: 700; font-variant-numeric: tabular-nums; }
  .detail { width: 300px; font-size: .68rem; color: #6c7d95; min-height: 1em; text-align: right; }
  .ver { position: absolute; bottom: 10px; font-size: .66rem; color: #55647d; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none } .bar > i { transition: none } }
</style>
</head>
<body>
  <img class="logo" src="build/icon.png" alt="" onerror="this.style.display='none'">
  <div class="title">پمپ یعقوبی</div>
  <div class="sub">نرم‌افزار مدیریت پمپ بنزین</div>
  <div class="bar"><i id="fill"></i></div>
  <div class="row"><span class="stage" id="stage">آماده‌سازی…</span><span class="pct" id="pct">۰٪</span></div>
  <div class="detail" id="detail"></div>
  <div class="ver" id="ver"></div>
<script>
// درصدها از فرایندِ اصلی می‌آیند و هرکدام یک کارِ واقعیِ انجام‌شده است
// (بایت‌های خوانده‌شدهٔ فایلِ برنامه، ساخته‌شدنِ صفحه، خوانده‌شدنِ دفترها…).
// اینجا هیچ عددی از خودش ساخته نمی‌شود و هیچ‌وقت هم عقب نمی‌رود.
(function () {
  var fill = document.getElementById('fill');
  var pctEl = document.getElementById('pct');
  var stageEl = document.getElementById('stage');
  var detailEl = document.getElementById('detail');
  var verEl = document.getElementById('ver');
  var shown = 0;

  function fa(n) { return String(n).replace(/[0-9]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[+d]; }); }

  window.__pumpSplash = function (p) {
    if (!p) return;
    if (typeof p.pct === 'number' && p.pct > shown) {
      shown = Math.min(100, Math.round(p.pct));
      fill.style.width = shown + '%';
      pctEl.textContent = fa(shown) + '٪';
    }
    if (p.stage) stageEl.textContent = p.stage;
    if (typeof p.detail === 'string') detailEl.textContent = p.detail;
    if (p.version) verEl.textContent = 'نسخهٔ ' + fa(p.version);
  };
})();
</script>
</body>
</html>
