<!-- نشانِ پمپ یعقوبی — «قطرهٔ تیل با گیجِ پُر»
     ─────────────────────────────────────────────────────────────────────────
     چرا این شکل: کارِ این برنامه دو چیز است — تیل، و اندازه گرفتن و حسابِ آن.
     پس نشان هم از همان دو چیز ساخته شده: یک قطرهٔ تیل، و داخلش عقربهٔ گیجی که
     روی «پُر» ایستاده. هیچ جزئیاتِ ریزی ندارد تا در ۴۸ پیکسلِ صفحهٔ گوشی و در
     ۲۶ پیکسلِ نوارِ اعلان هم همان‌قدر خوانا باشد.

     این فایل «اصلِ» نشان است — فقط خودِ نشان، بی‌پس‌زمینه. قابِ تیرهٔ آیکون‌ها را
     tools/make-icons.mjs خودش می‌کشد، تا نشانِ تک‌رنگِ اعلان از همین سیلوئت
     دربیاید و مربعِ توپر نشود. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="drop" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="0.45" stop-color="#F7A61B"/>
      <stop offset="1" stop-color="#E2740A"/>
    </linearGradient>
  </defs>

  <!-- قطره -->
  <path fill="url(#drop)" d="M256 46
    C256 46 400 208 400 300
    A144 144 0 1 1 112 300
    C112 208 256 46 256 46 Z"/>

  <!-- گیج: کمانِ باز + عقربه‌ای که روی «پُر» ایستاده -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M182 336 A86 86 0 1 1 330 336" stroke-width="25"/>
    <path d="M254 322 L318 254" stroke-width="25"/>
  </g>
  <circle cx="254" cy="322" r="19" fill="#FFFFFF"/>
</svg>
