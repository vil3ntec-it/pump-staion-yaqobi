<!-- لوگوی پمپ یعقوبی — قطرهٔ تیل + نازل
     تنها «اصلِ» لوگو همین فایل است؛ همهٔ آیکون‌های PNG (آیکونِ برنامه روی گوشی،
     apple-touch، favicon و نشانِ کوچکِ اعلان) با tools/make-icons.mjs از روی
     همین ساخته می‌شوند. برای عوض کردنِ لوگو فقط این‌جا را تغییر دهید و اسکریپت
     را دوباره اجرا کنید.

     ساختِ کار (تا دستکاری‌اش آسان باشد):
       • قطره: نوکِ بالا + دایرهٔ پایین.
       • خطِ جدا کنندهٔ طلایی/سرمه‌ای دقیقاً هم‌راستای خودِ نازل است (هر دو ۳۶ درجه).
       • نازل و دو شیلنگ در همان دستگاهِ چرخیده کشیده می‌شوند تا سرِ شیلنگ‌ها
         مو‌به‌مو به نازل بچسبد. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0.42" y1="0.03" x2="0.06" y2="0.86">
      <stop offset="0" stop-color="#FDBA17"/>
      <stop offset="0.5" stop-color="#F7A118"/>
      <stop offset="1" stop-color="#EF8B0C"/>
    </linearGradient>

    <clipPath id="dropClip">
      <path d="M256 44 C300 126 436 230 436 316 A180 180 0 1 1 76 316 C76 230 212 126 256 44 Z"/>
    </clipPath>

    <!-- حلقهٔ ماشه: از لبهٔ چپِ دسته باز می‌شود، همان‌طور که در نازلِ واقعی است -->
    <mask id="nzMask">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="228" y="384" width="58" height="22" rx="11" fill="#000"/>
    </mask>
  </defs>

  <g clip-path="url(#dropClip)">
    <rect width="512" height="512" fill="url(#gold)"/>
    <!-- نیمهٔ سرمه‌ای — نیم‌صفحه‌ای که با همان ۳۶ درجهٔ نازل چرخیده -->
    <path d="M246 -400 L1000 -400 L1000 1000 L246 1000 Z" fill="#17223F"
          transform="rotate(36 256 300)"/>
  </g>

  <!-- شیلنگِ طلایی: از تهِ دستهٔ نازل بیرون می‌زند، از لبهٔ پایین-چپِ قطره می‌گذرد و
       آزاد می‌ماند. عمداً بیرونِ لبه می‌رود، وگرنه طلایی روی طلایی دیده نمی‌شود. -->
  <path d="M168 428 C122 476 52 470 44 418 C38 376 78 350 116 358"
        fill="none" stroke="#EF8B0C" stroke-width="23" stroke-linecap="round"/>

  <g transform="rotate(36 256 300) translate(256 300) scale(1.06) translate(-256 -300)">
    <!-- شیلنگِ سرمه‌ای: از نوکِ لولهٔ نازل به بالا -->
    <path d="M256 148 C256 96 314 70 368 92"
          fill="none" stroke="#17223F" stroke-width="23" stroke-linecap="round"/>

    <g fill="#fff" mask="url(#nzMask)">
      <rect x="234" y="130" width="44" height="116" rx="18"/>   <!-- لولهٔ خروجی -->
      <rect x="221" y="238" width="70" height="34" rx="14"/>    <!-- گلویی -->
      <rect x="199" y="264" width="114" height="94" rx="30"/>   <!-- سرِ نازل -->
      <rect x="212" y="352" width="88" height="96" rx="28"/>    <!-- دسته -->
    </g>
  </g>
</svg>
