<!-- لوگوی پمپ یعقوبی — قطرهٔ تیل + نازل
     تنها «اصلِ» لوگو همین فایل است؛ همهٔ آیکون‌های PNG (آیکونِ برنامه روی گوشی،
     apple-touch، favicon و نشانِ کوچکِ اعلان) با tools/make-icons.mjs از روی
     همین ساخته می‌شوند. برای عوض کردنِ لوگو فقط این‌جا را تغییر دهید و اسکریپت
     را دوباره اجرا کنید.

     ساختِ نازل (چرا این‌طور کشیده شده): نازلِ واقعی چند استوانهٔ روی هم نیست —
     یک «تفنگ» است: لولهٔ باریکِ خمیده، گلویی، سرِ پهن، دستهٔ کج (هم‌راستای لوله
     نیست) و مهم‌تر از همه «حلقهٔ ماشه» که یک کمانِ باز است و سوراخِ وسطش همان
     چیزی است که چشم از آن نازل را می‌شناسد. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0.42" y1="0.03" x2="0.06" y2="0.86">
      <stop offset="0" stop-color="#FDBA17"/>
      <stop offset="0.5" stop-color="#F7A118"/>
      <stop offset="1" stop-color="#EF8B0C"/>
    </linearGradient>

    <clipPath id="dropClip">
      <path d="M256 44 C300 126 436 230 436 316 A180 180 0 1 1 76 316 C76 230 212 126 256 44 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#dropClip)">
    <rect width="512" height="512" fill="url(#gold)"/>
    <!-- نیمهٔ سرمه‌ای — نیم‌صفحه‌ای که با همان ۳۶ درجهٔ نازل چرخیده -->
    <path d="M246 -400 L1000 -400 L1000 1000 L246 1000 Z" fill="#17223F"
          transform="rotate(36 256 300)"/>
  </g>

  <!-- شیلنگِ طلایی: از تهِ دستهٔ نازل بیرون می‌زند، از لبهٔ پایین-چپِ قطره می‌گذرد و
       آزاد می‌ماند. عمداً بیرونِ لبه می‌رود، وگرنه طلایی روی طلایی دیده نمی‌شود. -->
  <path d="M176 434 C128 480 56 472 48 420 C42 378 82 352 120 360"
        fill="none" stroke="#EF8B0C" stroke-width="22" stroke-linecap="round"/>

  <g transform="rotate(34 256 300) translate(256 300) scale(1.1) translate(-256 -300)">
    <!-- شیلنگِ سرمه‌ای: از نوکِ لوله بالا می‌رود و بیرونِ قطره آزاد می‌ماند -->
    <path d="M268 132 C286 92 332 74 380 92"
          fill="none" stroke="#17223F" stroke-width="22" stroke-linecap="round"/>

    <!-- نازل: لوله + گلویی + بدنه + دستهٔ کج + ماشه + حلقهٔ ماشه -->
    <g fill="#fff">
      <path d="M240 138 C240 120 258 112 273 121 C283 127 285 139 282 151 L277 238 L239 236 Z"/>
      <rect x="224" y="230" width="74" height="30" rx="12"/>
      <rect x="198" y="254" width="130" height="78" rx="24"/>
      <rect x="224" y="326" width="82" height="112" rx="26" transform="rotate(12 265 330)"/>
      <rect x="186" y="360" width="58" height="22" rx="11" transform="rotate(12 215 371)"/>
    </g>
    <path d="M204 334 C146 374 152 432 222 438"
          fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
