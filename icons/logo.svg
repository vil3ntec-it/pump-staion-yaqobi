<!-- لوگوی پمپ یعقوبی — «قطرهٔ تیل و شعله»
     تنها «اصلِ» لوگو همین فایل است؛ همهٔ آیکون‌های PNG (آیکونِ برنامه روی گوشی،
     apple-touch، favicon و نشانِ کوچکِ اعلان) با tools/make-icons.mjs از روی
     همین ساخته می‌شوند. برای عوض کردنِ لوگو فقط این‌جا را تغییر دهید و اسکریپت
     را دوباره اجرا کنید.

     ساخت: قطرهٔ مشکی در چپ/پایین، شعلهٔ زرد در راست/بالا، و میانشان شکافِ سفید.
     شعله یک زبانهٔ داخلیِ سفید دارد و قطره یک هلالِ سفید در پایین. دو رنگِ تخت،
     بدونِ گرادیان — تا در هر اندازه‌ای تمیز بماند. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- قطرهٔ مشکی -->
  <path fill="#111111" d="M236 122
    C198 200 128 300 124 358
    C120 432 172 488 240 488
    C298 488 334 444 332 388
    C326 318 288 208 236 122 Z"/>
  <!-- هلالِ سفیدِ پایینِ قطره -->
  <path fill="#FFFFFF" d="M160 420
    C202 454 258 464 298 428
    C292 472 194 472 160 420 Z"/>
  <!-- شعلهٔ زرد -->
  <path fill="#EFB01F" d="M348 60
    C314 148 300 216 304 254
    C308 306 334 356 348 402
    C358 438 358 466 344 486
    C398 462 414 396 412 328
    C408 236 384 144 348 60 Z"/>
  <!-- زبانهٔ داخلیِ شعله -->
  <path fill="#FFFFFF" d="M356 146
    C374 212 382 272 373 318
    C366 352 352 362 345 348
    C364 316 362 226 356 146 Z"/>
</svg>
