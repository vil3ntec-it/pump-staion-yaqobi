<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#16213a;--mut:#5b6784;--line:#dbe1ec;--acc:#2556d8;--acc2:#3b82f6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--card:#171b24;--ink:#eef1f7;--mut:#9aa4ba;--line:#262c39;--acc:#3b82f6;--acc2:#6aa0ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;padding:20px 16px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:24px;margin:0}
.all{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:16px;color:#fff;font-weight:800;font-size:18px;text-decoration:none;background:linear-gradient(135deg,var(--acc2),var(--acc))}
.hint{color:var(--mut);font-size:14px;line-height:1.8;margin:0}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
figure img{display:block;width:100%;height:auto}
figcaption{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;flex-wrap:wrap}
figcaption b{font-size:16px}
figcaption span{display:block;color:var(--mut);font-size:13px}
.dl{padding:10px 18px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap}
a:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
</style>
</head>
